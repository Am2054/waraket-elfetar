<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار أوردرات الشغل (أداة المشرف)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#0b0f19;--bg-secondary:#131a26;--card-bg:#1a2332;
  --text-color:#f3f4f6;--text-secondary:#b0b8c6;
  --primary-neon:#00f2fe;--secondary-neon:#4facfe;--accent-purple:#7f00ff;
  --danger-color:#ff4757;--success-color:#2ed573;--warning-color:#ffa502;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Inter',sans-serif;background:var(--bg-color);color:var(--text-color);min-height:100vh;
  background-image:radial-gradient(circle at 85% -10%,rgba(127,0,255,.22),transparent 45%),radial-gradient(circle at 10% 110%,rgba(0,242,254,.14),transparent 45%);
  background-attachment:fixed;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}

/* Header */
.main-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.main-header h1{font-size:1.3rem;font-weight:900;color:var(--primary-neon);text-shadow:0 0 14px rgba(0,242,254,.55);margin:0}
h2{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.hidden{display:none!important}

/* Meals Switch */
.meals{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg-secondary);padding:6px;border-radius:16px;border:1px solid rgba(79,172,254,.25);margin-bottom:16px}
.meals button{font:inherit;font-weight:700;padding:11px 6px;border:0;border-radius:12px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:.25s}
.meals button.on{background:linear-gradient(135deg,var(--primary-neon),var(--secondary-neon));color:#04121a;box-shadow:0 0 18px rgba(0,242,254,.5)}

/* Cards */
.card{background:rgba(26,35,50,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,242,254,.28);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(127,0,255,.08),0 8px 28px rgba(0,0,0,.35);transition:.3s}
.muted{color:var(--text-secondary);font-size:.9rem}
.empty{text-align:center;color:var(--text-secondary);padding:26px 8px}

/* Inputs */
label{display:block;font-weight:600;margin:12px 0 6px;font-size:.95rem}
input[type=text],textarea{width:100%;font:inherit;color:var(--text-color);background:var(--bg-secondary);border:1px solid rgba(79,172,254,.35);border-radius:12px;padding:11px 13px;outline:none;transition:.25s}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{border-color:var(--primary-neon);box-shadow:0 0 12px rgba(0,242,254,.4)}

/* Shortcut Hint */
.shortcuts-hint{background:rgba(0,242,254,.07);border:1px dashed rgba(0,242,254,.3);border-radius:10px;padding:8px 10px;margin:8px 0 12px;font-size:.8rem;color:var(--secondary-neon);display:flex;justify-content:space-around;flex-wrap:wrap;gap:4px}
.shortcuts-hint span{font-weight:700}

/* Buttons */
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;cursor:pointer;color:#04121a;background:linear-gradient(135deg,var(--primary-neon),var(--secondary-neon));transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(0,242,254,.6)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent;color:var(--text-color);border:1px solid rgba(79,172,254,.45)}
.btn.danger{background:transparent;color:var(--danger-color);border:1px solid var(--danger-color)}
.btn.danger-filled{background:var(--danger-color);color:#fff}
.btn.danger-filled:hover{box-shadow:0 0 16px rgba(255,71,87,.6)}
.btn.ok{background:linear-gradient(135deg,var(--success-color),#26d0a0);color:#04121a}
.btn.warn{background:linear-gradient(135deg,var(--warning-color),#ffc048);color:#04121a}

.btn-top-reset{background:rgba(255,71,87,.15);border:1px solid var(--danger-color);color:var(--danger-color);padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn-top-reset:hover{background:var(--danger-color);color:#fff;box-shadow:0 0 12px rgba(255,71,87,.5)}

.card-actions{display:flex;align-items:center;gap:4px}
.btn-icon{background:transparent;border:none;font-size:1.05rem;cursor:pointer;padding:4px 6px;border-radius:8px;transition:.2s}
.btn-icon:hover{background:rgba(255,255,255,.1)}
.btn-icon.del:hover{background:rgba(255,71,87,.2)}

.row{display:flex;flex-wrap:wrap;gap:8px}
.row>.btn{flex:1 1 140px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:.9rem;border:1px solid}
.badge.open{color:var(--success-color);border-color:var(--success-color);background:rgba(46,213,115,.1)}
.badge.done{color:var(--success-color);border-color:var(--success-color);background:rgba(46,213,115,.2);font-size:.8rem}
.badge.wait{color:var(--warning-color);border-color:var(--warning-color);background:rgba(255,165,2,.2);font-size:.8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}

/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:16px 0 14px}
.tabs button{font:inherit;font-weight:700;padding:11px 4px;border-radius:12px;border:1px solid rgba(127,0,255,.5);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:.2s;font-size:.85rem}
.tabs button.on{background:linear-gradient(135deg,var(--accent-purple),var(--secondary-neon));color:#fff;box-shadow:0 0 16px rgba(127,0,255,.5)}

/* Lists */
.agg{list-style:none}
.agg li{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(176,184,198,.2)}
.agg li:last-child{border:0}
.agg b{color:var(--primary-neon);white-space:nowrap}
.total{margin-top:8px;text-align:left;font-weight:900;color:var(--warning-color)}

.alert-dup{background:rgba(255,71,87,.15);border:1px solid var(--danger-color);border-radius:12px;padding:12px;margin-bottom:14px;color:#ffd5d9;font-size:.9rem}
.alert-dup b{color:var(--danger-color)}

/* Worker Cards */
.wcard{transition:opacity .15s ease, transform .15s ease}
.wcard.fade{opacity:0;transform:scale(0.92);pointer-events:none}
.wcard .name{font-weight:900;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.wcard .items{background:var(--bg-secondary);border-radius:10px;padding:9px 12px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pill{font:inherit;font-weight:600;padding:8px 4px;border-radius:10px;border:1px solid rgba(79,172,254,.35);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:.2s;font-size:.85rem}
.pill.on{border-color:var(--primary-neon);color:var(--primary-neon);background:rgba(0,242,254,.1)}
.counter{text-align:center;font-weight:700;color:var(--warning-color);margin-bottom:12px}
.party{text-align:center;border-color:var(--success-color);box-shadow:0 0 28px rgba(46,213,115,.4);font-size:1.15rem;font-weight:900;padding:28px 14px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,8,14,.78);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal .box{background:var(--card-bg);border:1px solid var(--primary-neon);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 0 28px rgba(0,242,254,.35)}
@media(min-width:600px){.modal{align-items:center}.modal .box{border-radius:20px}}
.sheet-row{padding:9px 0;border-bottom:1px dashed rgba(176,184,198,.2)}
.sheet-row .ok-t{color:var(--success-color)}.sheet-row .wait-t{color:var(--warning-color)}

/* Toast */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card-bg);border:1px solid var(--success-color);border-radius:14px;padding:11px 14px;font-weight:700;text-align:center;box-shadow:0 0 18px rgba(46,213,115,.4);animation:tin .3s;transition:.4s}
.toast.error{border-color:var(--danger-color);box-shadow:0 0 18px rgba(255,71,87,.4)}
.toast.info{border-color:var(--secondary-neon);box-shadow:0 0 18px rgba(79,172,254,.4)}
.toast.out{opacity:0;transform:translateY(-12px)}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div class="wrap">
  
  <header class="main-header">
    <h1>📡 رادار أوردرات الشغل</h1>
    <button class="btn btn-top-reset" id="resetBtnTop" type="button">🗑️ بدء أوردر جديد</button>
  </header>

  <!-- تبديل الوجبة -->
  <div class="meals" role="tablist">
    <button id="mb-breakfast" data-meal="breakfast">🥪 أوردر الفطار</button>
    <button id="mb-dinner" data-meal="dinner">🍔 أوردر العشاء / الغداء</button>
  </div>

  <!-- كارت تسجيل الطلب النظيف (مربع واحد شامل) -->
  <div class="card" id="formCard">
    <div class="top">
      <h2 id="formTitle">➕ تسجيل طلب موظف</h2>
      <span id="orderCountBadge" class="badge open">0 موظفين</span>
    </div>

    <label for="fName">اسم الموظف</label>
    <input type="text" id="fName" placeholder="مثال: أحمد فتحي" maxlength="60">

    <!-- شريط تلميح الحروف (في الفطار فقط) -->
    <div class="shortcuts-hint" id="shortcutsHint">
      <span>⚡ س = سندوتش (5 س فول)</span>
      <span>🥡 ع = علبة (2 ع مسقعة)</span>
      <span>🛍️ ك = كيس (1 ك طعمية)</span>
      <span>💵 ج = جنيه (15 ج بطاطس)</span>
    </div>

    <label for="fDetails" id="lblDetails">تفاصيل الطلب بالكامل</label>
    <textarea id="fDetails" placeholder="اكتب براحتك في مربع واحد: 5 فول 2 طعمية 1 شيبسي 1 كانز بيبسي 1 علبة جبنة"></textarea>

    <div class="row" style="margin-top:14px">
      <button class="btn ok" id="savePersonBtn" type="button" style="width:100%; padding:13px;">💾 حفظ الطلب</button>
    </div>
  </div>

  <!-- التبويبات -->
  <div class="tabs">
    <button id="tb-cashier" data-tab="cashier" class="on">جمع الطلبات 📊</button>
    <button id="tb-deliver" data-tab="deliver">وقت التوزيع 📦</button>
    <button id="tb-all" data-tab="all">كل الأوردرات 📋</button>
  </div>

  <!-- 1. جمع الطلبات (المفروز تلقائياً) -->
  <div id="paneCashier">
    <div style="text-align:center; margin-bottom:14px;">
      <button class="btn warn" id="btnCalculateSummary" type="button" style="width:100%; padding:14px; font-size:1.05rem;">
        ⚡ اضغط لتجميع وفرز كل الطلبات الآن
      </button>
    </div>

    <div id="dupAlertContainer"></div>
    <div id="summaryResultsContainer">
      <div class="card empty">اضغط على الزرار بالأعلى لفرز طلبات المطعم، والسوبر ماركت، والمخبز تلقائياً.</div>
    </div>
  </div>

  <!-- 2. وقت التوزيع -->
  <div id="paneDeliver" class="hidden"></div>

  <!-- 3. كل الأوردرات -->
  <div id="paneAll" class="hidden"></div>

  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="sheetBtn" type="button" style="width:100%">📜 ورقة الأوردر الأخيرة (24 ساعة)</button>
  </div>
</div>

<!-- Modal الأرشيف مع زر الحذف النهائي -->
<div class="modal hidden" id="mSheet"><div class="box">
  <div class="top">
    <h2>📜 ورقة الأوردر والسجل</h2>
    <button class="btn btn-icon del" data-close style="font-size:1.2rem;">✖</button>
  </div>
  
  <div id="sheetBody"></div>

  <div class="row" style="margin-top:16px">
    <button class="btn danger-filled" id="deleteArchiveBtn" type="button" style="flex:2">🗑️ حذف السجل نهائياً</button>
    <button class="btn ghost" data-close type="button" style="flex:1">إغلاق</button>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const firebaseConfig = {
  apiKey: "AIzaSyBfOJPkWbmcJ6s29bDNysr-H0Kx-Js3Gy0",
  authDomain: "am--rewards.firebaseapp.com",
  databaseURL: "https://am--rewards-default-rtdb.firebaseio.com",
  projectId: "am--rewards",
  storageBucket: "am--rewards.firebasestorage.app",
  messagingSenderId: "744783579735",
  appId: "1:744783579735:web:45e00de9998893bbc9b112"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEALS = {
  breakfast: {label:'الفطار', icon:'🥪', doc:'active_breakfast'},
  dinner:    {label:'العشاء / الغداء', icon:'🍔', doc:'active_dinner'}
};
let meal = 'breakfast', unsub = null, tab = 'cashier';
let state = {items:[]};
const payChoice = {}; 
let editingId = null;
let isSummaryCalculated = false;

const localStore = {
  get(m){
    try { return JSON.parse(localStorage.getItem('radar_meal_' + m)) || {items:[]}; }
    catch(e){ return {items:[]}; }
  },
  set(m, data){
    try { localStorage.setItem('radar_meal_' + m, JSON.stringify(data)); }
    catch(e){}
  }
};

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2200);
  setTimeout(() => t.remove(), 2600);
}
function openM(id){ $(id).classList.remove('hidden'); }
function closeM(id){ $(id).classList.add('hidden'); }
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); });
  m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => m.classList.add('hidden')));
});

async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ---------- Firebase Firestore ---------- */
const ref = (m) => db.collection('work_orders').doc(MEALS[m || meal].doc);

function listen(){
  if (unsub){ unsub(); unsub = null; }
  state = localStore.get(meal);
  render();

  try {
    unsub = ref().onSnapshot(
      snap => { 
        if (snap.exists && Array.isArray(snap.data().items)){
          state = {items: snap.data().items};
          localStore.set(meal, state);
          render();
          if (isSummaryCalculated) calculateAndDisplaySummary();
        }
      },
      err => { console.warn('Firebase sync notice:', err); }
    );
  } catch(e) {}
}

async function mutate(fn){
  const next = fn(state);
  state = next;
  localStore.set(meal, state);
  render();
  if (isSummaryCalculated) calculateAndDisplaySummary();

  try {
    const r = ref();
    await r.set({
      items: next.items,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  } catch(e) {
    console.warn('Saved locally:', e);
  }
}

/* ---------- القاموس المصري الشامل لتصنيف المحلات (أكثر من 100 كلمة) ---------- */
const SUPERMARKET_DICT = [
  'شيبسي', 'تايجر', 'شيتوس', 'دوريتوس', 'كاراتيه', 'بيبيتو', 'شيبس',
  'بيبسي', 'كولا', 'كوكاكولا', 'سفن', 'سبرايت', 'شويبس', 'ميرندا', 'فانتا', 'سبيروسباتس', 'كانز', 'صودا',
  'عصير', 'جهينه', 'بيتي', 'لبن', 'حليب', 'زبادي', 'رايب',
  'جبنه', 'جبنة', 'رومي', 'فيتا', 'اسطنبولي', 'شيدر', 'موزاريلا', 'براميلي', 'قريش', 'كيري', 'طعمة',
  'تونة', 'تونه', 'سردين', 'بلوبيف',
  'نسكافيه', 'كوفي ميكس', 'شاي', 'قهوة', 'سكر', 'مياه', 'ميه', 'معدنيه', 'معدنية',
  'امير', 'انبوبة امير', 'سوبر جلو', 'مناديل', 'ولاعه', 'كبريت',
  'بسكوت', 'شيكولاته', 'شوكولاته', 'ويفر', 'بان كيك', 'مولتو', 'هوهوز', 'توينكيز', 'علكه', 'لبان', 'كلوريتس', 'تريتس', 'شيكولاته'
];

const BAKERY_DICT = [
  'فطير', 'فطيرة', 'فطيره', 'مشلتت', 'قشطة', 'قشطه', 'عسل', 'مش', 'جبنة قديمة', 'جبنه قديمه',
  'باتيه', 'كرواسون', 'بوريك', 'قرص', 'قرصة', 'سميط', 'عيش سن', 'فينو', 'عيش فينو', 'كيك', 'كب كيك', 'باتون ساليه', 'سابليه'
];

const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toEn = s => String(s).replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace(/٫/g,'.');

function cleanItemName(s){
  return s.replace(/[أإآ]/g,'ا')
          .replace(/ى/g,'ي')
          .replace(/ة/g,'ه')
          .replace(/ـ/g,'')
          .replace(/\s+/g,' ')
          .trim();
}

const keyOf = s => cleanItemName(s).toLowerCase();

function smartSplit(t){
  let normalized = toEn(t).replace(/\r\n/g, '\n');
  normalized = normalized.replace(/([^\d\n,،+؛;])\s+(\d+)/g, '$1\n$2');
  return normalized
    .split(/[\n,،+؛;]|\s+و\s+/)
    .map(s => s.trim())
    .filter(Boolean);
}

// دالة تصنيف الصنف وتطبيق نظام الحروف (في الفطار فقط)
function parseRawItem(seg, isBreakfast){
  seg = toEn(seg).trim();
  if (!seg) return null;

  let clean = cleanItemName(seg);

  // 1. هل الصنف يتبع المخبز والفطاطري؟
  const isBakery = BAKERY_DICT.some(w => clean.includes(w));
  if (isBakery){
    let m = seg.match(/^(\d+)\s*(?:x|×|-)?\s*(.*)$/i);
    let qty = m ? +m[1] : 1;
    let name = m && m[2].trim() ? cleanItemName(m[2]) : clean;
    return { shop: 'bakery', qty, name };
  }

  // 2. هل الصنف يتبع السوبر ماركت؟
  const isSupermarket = SUPERMARKET_DICT.some(w => clean.includes(w));
  if (isSupermarket){
    let m = seg.match(/^(\d+)\s*(?:x|×|-)?\s*(.*)$/i);
    let qty = m ? +m[1] : 1;
    let name = m && m[2].trim() ? cleanItemName(m[2]) : clean;
    return { shop: 'supermarket', qty, name };
  }

  // 3. يتبع مطعم الأكل / الفول والطعام:
  // نظام الحروف (س، ع، ك، ج) يطبق في الفطار فقط
  if (isBreakfast){
    // فلوس (ج / جنيه / بـ)
    let mMoney = seg.match(/^(?:ب\u0640*)?\s*(\d+(?:\.\d+)?)\s*(?:ج|جنيه|جنية|egp)\s+(.*)$/i) ||
                 seg.match(/^ب\u0640*(\d+(?:\.\d+)?)\s+(.*)$/i) ||
                 seg.match(/^(.*?)\s*(\d+(?:\.\d+)?)\s*(?:ج|جنيه|جنية|egp)$/i);
    if (mMoney) {
      const amt = +mMoney[1] || +mMoney[2];
      const name = cleanItemName(mMoney[1] ? mMoney[2] : mMoney[1]);
      return { shop: 'restaurant', kind: 'money', amt, name: name || 'فول' };
    }

    // علب (ع / علبة)
    let mBox = seg.match(/^(\d+)\s*(?:ع|علبه|علبة|علب)\s+(.*)$/i) ||
               seg.match(/^(?:ع|علبه|علبة)\s+(.*)$/i);
    if (mBox) {
      const qty = mBox[2] ? +mBox[1] : 1;
      const name = cleanItemName(mBox[2] || mBox[1]);
      return { shop: 'restaurant', kind: 'box', qty, name: name || 'علبة' };
    }

    // أكياس (ك / كيس)
    let mBag = seg.match(/^(\d+)\s*(?:ك|كيس|اكياس|أكياس)\s+(.*)$/i) ||
               seg.match(/^(?:ك|كيس)\s+(.*)$/i);
    if (mBag) {
      const qty = mBag[2] ? +mBag[1] : 1;
      const name = cleanItemName(mBag[2] || mBag[1]);
      return { shop: 'restaurant', kind: 'bag', qty, name: name || 'كيس' };
    }

    // سندوتشات صريحة (س)
    let mSand = seg.match(/^(\d+)\s*(?:س|سندوتش|ساندوتش|سندوتشات)\s+(.*)$/i) ||
                seg.match(/^(?:س|سندوتش|ساندوتش)\s+(.*)$/i);
    if (mSand) {
      const qty = mSand[2] ? +mSand[1] : 1;
      const name = cleanItemName(mSand[2] || mSand[1]);
      return { shop: 'restaurant', kind: 'sand', qty, name: name || 'سندوتش' };
    }
  }

  // في العشاء أو الأرقام العادية بالمطعم
  let mNum = seg.match(/^(\d+)\s*(?:x|×|-)?\s*(.*)$/i);
  if (mNum && mNum[2].trim()){
    return { shop: 'restaurant', kind: 'sand', qty: +mNum[1], name: cleanItemName(mNum[2]) };
  }

  return { shop: 'restaurant', kind: 'sand', qty: 1, name: clean };
}

function aggregate(items){
  const isBreakfast = (meal === 'breakfast');
  
  // مطعم
  const restSand = new Map();
  const restMoney = new Map();
  const restBoxes = new Map();
  const restBags = new Map();
  
  // سوبر ماركت
  const supermarket = new Map();
  
  // مخبز وفطاطري
  const bakery = new Map();

  items.forEach(it => {
    smartSplit(it.details || '').forEach(seg => {
      const p = parseRawItem(seg, isBreakfast);
      if (!p) return;

      const k = keyOf(p.name);

      if (p.shop === 'supermarket'){
        const e = supermarket.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        supermarket.set(k, e);
      } else if (p.shop === 'bakery'){
        const e = bakery.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        bakery.set(k, e);
      } else {
        // المطعم
        if (p.kind === 'money'){
          const e = restMoney.get(k) || {name: p.name, amt: 0};
          e.amt += p.amt;
          restMoney.set(k, e);
        } else if (p.kind === 'box'){
          const e = restBoxes.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          restBoxes.set(k, e);
        } else if (p.kind === 'bag'){
          const e = restBags.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          restBags.set(k, e);
        } else {
          const e = restSand.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          restSand.set(k, e);
        }
      }
    });
  });

  return {
    restSand: [...restSand.values()].sort((a,b) => b.qty - a.qty),
    restMoney: [...restMoney.values()].sort((a,b) => b.amt - a.amt),
    restBoxes: [...restBoxes.values()].sort((a,b) => b.qty - a.qty),
    restBags: [...restBags.values()].sort((a,b) => b.qty - a.qty),
    supermarket: [...supermarket.values()].sort((a,b) => b.qty - a.qty),
    bakery: [...bakery.values()].sort((a,b) => b.qty - a.qty)
  };
}

const fmt = n => (Math.round(n * 100) / 100).toLocaleString('en-US');

function buildSummary(){
  const a = aggregate(state.items);
  const d = new Date().toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});
  let t = MEALS[meal].icon + ' فرز أوردر ' + MEALS[meal].label + ' - ' + d + '\n';
  
  // 1. المطعم
  const restTitle = meal === 'dinner' ? '🍽️ طلبات المطعم (الوجبات):' : '🍽️ طلبات مطعم الفول والطعام:';
  t += '\n' + restTitle + '\n';
  if (a.restSand.length) t += a.restSand.map(s => '• ' + s.qty + ' ' + s.name).join('\n') + '\n';
  if (a.restMoney.length) t += a.restMoney.map(b => '• ' + b.name + ': إجمالي ' + fmt(b.amt) + ' جنيه').join('\n') + '\n';
  if (a.restBoxes.length) t += a.restBoxes.map(b => '• ' + b.qty + ' علبة ' + b.name).join('\n') + '\n';
  if (a.restBags.length) t += a.restBags.map(b => '• ' + b.qty + ' كيس ' + b.name).join('\n') + '\n';

  // 2. السوبر ماركت
  if (a.supermarket.length){
    t += '\n🏪 طلبات السوبر ماركت:\n' + a.supermarket.map(s => '• ' + s.qty + ' ' + s.name).join('\n') + '\n';
  }

  // 3. المخبز والفطاطري
  if (a.bakery.length){
    t += '\n🥐 المخبز والفطاطري:\n' + a.bakery.map(b => '• ' + b.qty + ' ' + b.name).join('\n') + '\n';
  }

  return t.trim();
}

function checkDuplicates(items){
  const map = new Map();
  const duplicates = [];

  items.forEach(it => {
    const orderFingerprint = keyOf(it.name) + '___' + cleanItemName(it.details || '');
    if (map.has(orderFingerprint)){
      duplicates.push({ name: it.name, details: it.details });
    } else {
      map.set(orderFingerprint, true);
    }
  });

  return duplicates;
}

function calculateAndDisplaySummary(){

  const dupContainer = $('dupAlertContainer');

  if (!state.items.length){
    p.innerHTML = '<div class="card empty">📭 لسه مفيش موظفين متسجلين في أوردر ' + esc(MEALS[meal].label) + '.</div>';

  }

  // فحص التكرار

  if (dups.length > 0){
    dupContainer.innerHTML = '<div class="alert-dup">' +
      '⚠️ <b>تنبيه بخصوص أوردرات مكررة:</b> تم تسجيل نفس الموظف والطلب مرتين:<br>' +
      dups.map(d => '• <b>' + esc(d.name) + ':</b> ' + esc(d.details)).join('<br>') +
      '</div>';
  } else {
    dupContainer.innerHTML = '';
  }

  const a = aggregate(state.items);
  let h = '';

  // 1. كارت المطعم
  const restTitle = meal === 'dinner' ? '🍽️ طلبات المطعم الرئيسي (الوجبات)' : '🍽️ طلبات مطعم الفول والطعام';

  if (a.restSand.length) h += a.restSand.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + '</b></li>').join('');
  if (a.restMoney.length) h += a.restMoney.map(b => '<li><span>' + esc(b.name) + '</span><b>إجمالي ' + fmt(b.amt) + ' جنيه</b></li>').join('');
  if (a.restBoxes.length) h += a.restBoxes.map(b => '<li><span>' + esc(b.name) + '</span><b>' + b.qty + ' علبة</b></li>').join('');
  if (a.restBags.length) h += a.restBags.map(b => '<li><span>' + esc(b.name) + '</span><b>' + b.qty + ' كيس</b></li>').join('');
  if (!a.restSand.length && !a.restMoney.length && !a.restBoxes.length && !a.restBags.length) h += '<li class="muted">لا توجد طلبات مطعم</li>';
  h += '</ul></div>';

  // 2. كارت السوبر ماركت
  if (a.supermarket.length){
    h += '<div class="card" style="border-color:var(--secondary-neon)"><h2>🏪 مشوار السوبر ماركت والبقالة</h2><ul class="agg">' +
      a.supermarket.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + ' عدد</b></li>').join('') +
      '</ul><div class="total" style="color:var(--secondary-neon)">إجمالي أصناف البقالة: ' + a.supermarket.reduce((x,s) => x + s.qty, 0) + '</div></div>';
  }

  // 3. كارت المخبز والفطاطري
  if (a.bakery.length){
    h += '<div class="card" style="border-color:var(--warning-color)"><h2>🥐 مشوار المخبز والفطاطري</h2><ul class="agg">' +
      a.bakery.map(b => '<li><span>' + esc(b.name) + '</span><b>' + b.qty + ' عدد</b></li>').join('') +
      '</ul><div class="total">إجمالي المخبوزات: ' + a.bakery.reduce((x,b) => x + b.qty, 0) + '</div></div>';
  }

  h += '<div class="row" style="margin-bottom:14px"><button class="btn" id="copySum" type="button">📋 نسخ لستة المشاوير</button>' +
       '<button class="btn ok" id="waSum" type="button">💬 إرسال عبر واتساب</button></div>';
  p.innerHTML = h;
  $('copySum').onclick = async () => toast(await copyText(buildSummary()) ? '📋 تم نسخ الملخص المفروز' : '❌ تعذر النسخ', 'info');
  $('waSum').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(buildSummary()), '_blank', 'noopener');
}

  left.forEach(it => {

      '<div class="name">' +
        '<span>👤 ' + esc(it.name) + '</span>' +

    card.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {

async function deleteWorker(id){
  if (!confirm('هل تريد حذف هذا الطلب من القائمة؟')) return;
  if (editingId === id) resetFormToNew();
  await mutate(cur => {
    cur.items = cur.items.filter(x => x.id !== id);
    return cur;
  });
  toast('🗑️ تم حذف الطلب بنجاح', 'info');
}

function resetFormToNew(){
  editingId = null;
  $('fName').value = '';
  $('fDetails').value = '';
  $('formTitle').textContent = '➕ تسجيل طلب موظف';
  $('savePersonBtn').textContent = '💾 حفظ الطلب';

}

/* ---------- حفظ الطلب والتفريغ الفوري للشخص التالي ---------- */
$('savePersonBtn').addEventListener('click', async () => {
  const name = $('fName').value.trim();
  const details = $('fDetails').value.trim();

  if (!name) return toast('⚠️ اكتب اسم الموظف الأول', 'error');
  if (!details) return toast('⚠️ اكتب تفاصيل الطلب', 'error');

  const btn = $('savePersonBtn'); 
  btn.disabled = true;

  try{
    if (editingId){
      await mutate(cur => {
        cur.items = cur.items.map(x => {
          if (x.id === editingId){
            return { ...x, name, details };
          }
          return x;
        });
        return cur;
      });
      toast('✅ تم تحديث طلب (' + name + ') بنجاح!');
      resetFormToNew();
    } else {
      const newId = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const newItem = {
        id: newId,
        name,
        details,
        delivered: false,
        payment: '',
        createdAt: Date.now()
      };

      await mutate(cur => {
        cur.items = cur.items.concat([newItem]);
        return cur;
      });

      resetFormToNew();
      toast('💾 تم حفظ (' + name + ')! اكتب الشخص اللي بعده.');
    }
  }catch(e){
    console.error(e);
    toast('❌ حصلت مشكلة في الحفظ', 'error');
  }finally{
    btn.disabled = false;
  }
});

/* ---------- سجل 24 ساعة وحذف السجل نهائياً ---------- */
function sheetHtml(items){
  return items.map(it => {
    const st = it.delivered
      ? '<span class="ok-t">✔ استلم (' + (it.payment === 'instapay' ? '📱 إنستاباي' : '💵 كاش') + ')</span>'
      : '<span class="wait-t">⏳ لم يستلم</span>';
    return '<div class="sheet-row"><b>' + esc(it.name) + '</b> — ' + st + '<br><span class="muted">' + esc(it.details) + '</span></div>';
  }).join('');
}

$('sheetBtn').addEventListener('click', async () => {
  const body = $('sheetBody');
  body.innerHTML = '<div class="empty">⏳ جاري تحميل السجل...</div>';
  openM('mSheet');
  
  let h = '<h3 style="color:var(--primary-neon); margin-bottom:8px;">الأوردر الحالي</h3>' +
    (state.items.length ? sheetHtml(state.items) : '<div class="empty">لا توجد طلبات حالية</div>');
  
  try{
    const snap = await db.collection('work_orders_archive').where('meal','==',meal).get();
    const cutoff = Date.now() - 24*60*60*1000;
    const rows = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(d => (d.archivedMs || 0) >= cutoff).sort((a,b) => b.archivedMs - a.archivedMs);
    h += '<h3 style="margin-top:16px;color:var(--secondary-neon); margin-bottom:8px;">أوردرات سابقة في آخر 24 ساعة</h3>';
    h += rows.length ? rows.map(r => '<div class="muted" style="margin-top:8px">' +
      new Date(r.archivedMs).toLocaleString('ar-EG') + '</div>' + sheetHtml(r.items || [])).join('')
      : '<div class="empty">لا توجد أوردرات سابقة</div>';
  }catch(e){
    h += '<div class="empty muted">عرض السجل المحلي فقط</div>';
  }
  body.innerHTML = h;
});

// حذف السجل نهائياً من قاعدة البيانات والمتصفح
$('deleteArchiveBtn').addEventListener('click', async () => {
  if (!confirm('⚠️ تحذير: هل أنت متأكد من مسح جميع الأوردرات السابقة والسجل نهائياً من قاعدة البيانات؟')) return;
  
  try{
    $('deleteArchiveBtn').disabled = true;
    
    // 1. مسح أرشيف الوجبة من Firestore
    const snap = await db.collection('work_orders_archive').where('meal', '==', meal).get();
    const batch = db.batch();
    snap.docs.forEach(doc => {
      batch.delete(doc.ref);
    });
    await batch.commit();

    // 2. تفريغ السجل في واجهة المودال
    $('sheetBody').innerHTML = '<div class="empty" style="color:var(--success-color)">🗑️ تم حذف السجل بالكامل بنجاح.</div>';
    
    toast('✅ تم حذف السجل نهائياً من قاعدة البيانات بنجاح!');
  }catch(e){
    console.error(e);
    toast('❌ تعذر حذف السجل من قاعدة البيانات', 'error');
  }finally{
    $('deleteArchiveBtn').disabled = false;
  }
});

/* ---------- تشغيل البرنامج وضبط الواجهة ---------- */
updateMealUI();
listen();
</script>
</body>
</html>
