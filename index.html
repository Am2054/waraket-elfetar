<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار أوردرات الشغل (أداة المشرف)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#0b0f19;--bg-secondary:#131a26;--card-bg:#1a2332;
  --text-color:#f3f4f6;--text-secondary:#b0b8c6;
  --primary-neon:#00f2fe;--secondary-neon:#4facfe;--accent-purple:#7f00ff;
  --danger-color:#ff4757;--success-color:#2ed573;--warning-color:#ffa502;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Inter',sans-serif;background:var(--bg-color);color:var(--text-color);min-height:100vh;
  background-image:radial-gradient(circle at 85% -10%,rgba(127,0,255,.22),transparent 45%),radial-gradient(circle at 10% 110%,rgba(0,242,254,.14),transparent 45%);
  background-attachment:fixed;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.35rem;font-weight:900;text-align:center;margin:6px 0 14px;color:var(--primary-neon);text-shadow:0 0 14px rgba(0,242,254,.55)}
h2{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.hidden{display:none!important}

/* meal switch */
.meals{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg-secondary);padding:6px;border-radius:16px;border:1px solid rgba(79,172,254,.25);margin-bottom:16px}
.meals button{font:inherit;font-weight:700;padding:11px 6px;border:0;border-radius:12px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:.25s}
.meals button.on{background:linear-gradient(135deg,var(--primary-neon),var(--secondary-neon));color:#04121a;box-shadow:0 0 18px rgba(0,242,254,.5)}

/* cards */
.card{background:rgba(26,35,50,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,242,254,.28);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(127,0,255,.08),0 8px 28px rgba(0,0,0,.35);transition:.3s}
.muted{color:var(--text-secondary);font-size:.9rem}
.empty{text-align:center;color:var(--text-secondary);padding:26px 8px}

/* form */
label{display:block;font-weight:600;margin:12px 0 6px;font-size:.95rem}
input[type=text],textarea{width:100%;font:inherit;color:var(--text-color);background:var(--bg-secondary);border:1px solid rgba(79,172,254,.35);border-radius:12px;padding:11px 13px;outline:none;transition:.25s}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{border-color:var(--primary-neon);box-shadow:0 0 12px rgba(0,242,254,.4)}

/* Segmented Control */
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button,.pill{font:inherit;font-weight:600;padding:10px 4px;border-radius:12px;border:1px solid rgba(79,172,254,.35);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:.2s;font-size:.85rem}
.seg button.on,.pill.on{border-color:var(--primary-neon);color:var(--primary-neon);background:rgba(0,242,254,.1);box-shadow:0 0 12px rgba(0,242,254,.35)}

/* Buttons */
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;cursor:pointer;color:#04121a;background:linear-gradient(135deg,var(--primary-neon),var(--secondary-neon));transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(0,242,254,.6)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent;color:var(--text-color);border:1px solid rgba(79,172,254,.45)}
.btn.danger{background:transparent;color:var(--danger-color);border:1px solid var(--danger-color)}
.btn.purple{background:linear-gradient(135deg,var(--accent-purple),var(--secondary-neon));color:#fff}
.btn.ok{background:linear-gradient(135deg,var(--success-color),#26d0a0);color:#04121a}
.btn.warn{background:linear-gradient(135deg,var(--warning-color),#ffc048);color:#04121a}

/* Action Icons */
.card-actions{display:flex;align-items:center;gap:4px}
.btn-icon{background:transparent;border:none;font-size:1.05rem;cursor:pointer;padding:4px 6px;border-radius:8px;transition:.2s}
.btn-icon:hover{background:rgba(255,255,255,.1)}
.btn-icon.del:hover{background:rgba(255,71,87,.2)}

.row{display:flex;flex-wrap:wrap;gap:8px}
.row>.btn{flex:1 1 140px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:.9rem;border:1px solid}
.badge.open{color:var(--success-color);border-color:var(--success-color);background:rgba(46,213,115,.1)}
.badge.done{color:var(--success-color);border-color:var(--success-color);background:rgba(46,213,115,.2);font-size:.8rem}
.badge.wait{color:var(--warning-color);border-color:var(--warning-color);background:rgba(255,165,2,.2);font-size:.8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:16px 0 14px}
.tabs button{font:inherit;font-weight:700;padding:11px 4px;border-radius:12px;border:1px solid rgba(127,0,255,.5);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:.2s;font-size:.85rem}
.tabs button.on{background:linear-gradient(135deg,var(--accent-purple),var(--secondary-neon));color:#fff;box-shadow:0 0 16px rgba(127,0,255,.5)}

/* aggregation */
.agg{list-style:none}
.agg li{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(176,184,198,.2)}
.agg li:last-child{border:0}
.agg b{color:var(--primary-neon);white-space:nowrap}
.total{margin-top:8px;text-align:left;font-weight:900;color:var(--warning-color)}

/* worker cards (سريعة بدون تقل) */
.wcard{transition:opacity .15s ease, transform .15s ease}
.wcard.fade{opacity:0;transform:scale(0.92);pointer-events:none}
.wcard .name{font-weight:900;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.wcard .items{background:var(--bg-secondary);border-radius:10px;padding:9px 12px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.tag{font-size:.78rem;padding:2px 10px;border-radius:99px;background:rgba(127,0,255,.25);color:#d6b8ff}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.counter{text-align:center;font-weight:700;color:var(--warning-color);margin-bottom:12px}
.party{text-align:center;border-color:var(--success-color);box-shadow:0 0 28px rgba(46,213,115,.4);font-size:1.15rem;font-weight:900;padding:28px 14px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,8,14,.78);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal .box{background:var(--card-bg);border:1px solid var(--primary-neon);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 0 28px rgba(0,242,254,.35)}
@media(min-width:600px){.modal{align-items:center}.modal .box{border-radius:20px}}
.sheet-row{padding:9px 0;border-bottom:1px dashed rgba(176,184,198,.2)}
.sheet-row .ok-t{color:var(--success-color)}.sheet-row .wait-t{color:var(--warning-color)}

/* toast */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card-bg);border:1px solid var(--success-color);border-radius:14px;padding:11px 14px;font-weight:700;text-align:center;box-shadow:0 0 18px rgba(46,213,115,.4);animation:tin .3s;transition:.4s}
.toast.error{border-color:var(--danger-color);box-shadow:0 0 18px rgba(255,71,87,.4)}
.toast.info{border-color:var(--secondary-neon);box-shadow:0 0 18px rgba(79,172,254,.4)}
.toast.out{opacity:0;transform:translateY(-12px)}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div class="wrap">
  <h1>📡 رادار أوردرات الشغل</h1>

  <!-- تبديل الوجبة -->
  <div class="meals" role="tablist">
    <button id="mb-breakfast" data-meal="breakfast">🥪 أوردر الفطار</button>
    <button id="mb-dinner" data-meal="dinner">🍔 أوردر العشاء / الغداء</button>
  </div>

  <!-- كارت تسجيل وتعديل الطلب -->
  <div class="card" id="formCard">
    <div class="top">
      <h2 id="formTitle">➕ تسجيل طلب موظف</h2>
      <span id="orderCountBadge" class="badge open">0 موظفين</span>
    </div>

    <label for="fName">اسم الموظف</label>
    <input type="text" id="fName" placeholder="مثال: أحمد فتحي" maxlength="60">

    <!-- قسم نوع الطلب (يظهر في الفطار فقط) -->
    <div id="typeSegContainer">
      <label>نوع الطلب</label>
      <div class="seg" id="typeSeg">
        <button type="button" data-type="sandwich" class="on">🥪 سندوتشات</button>
        <button type="button" data-type="bulk">🥡 علب وأكياس</button>
        <button type="button" data-type="mixed">🔀 مكس (الاتنين)</button>
      </div>
    </div>

    <!-- حقل السندوتشات / الطلب العام -->
    <div id="boxSand">
      <label for="fSand" id="lblSand">السندوتشات (بالعدد)</label>
      <textarea id="fSand" placeholder="2 فول زيت حار، 1 طعمية محشية"></textarea>
    </div>

    <!-- حقل العلب بالجنيه (للفطار فقط) -->

    <div class="row" style="margin-top:14px">

  <!-- التبويبات الثلاثة -->
  <div class="tabs">
    <button id="tb-cashier" data-tab="cashier" class="on">جمع الطلبات 📊</button>
    <button id="tb-deliver" data-tab="deliver">وقت التوزيع 📦</button>

  </div>

  <!-- 1. جمع الطلبات -->
  <div id="paneCashier">
    <div style="text-align:center; margin-bottom:14px;">
      <button class="btn warn" id="btnCalculateSummary" type="button" style="width:100%; padding:14px; font-size:1.05rem;">
        ⚡ اضغط لتجميع وحساب كل الطلبات الآن
      </button>
    </div>
    <div id="summaryResultsContainer">
      <div class="card empty">اضغط على الزرار بالأعلى لتجميع وحساب إجمالي الأصناف والفلوس.</div>
    </div>
  </div>

  <!-- 2. وقت التوزيع -->
  <div id="paneDeliver" class="hidden"></div>

  <!-- أزرار الإدارة السفلية -->
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="sheetBtn" type="button">📜 ورقة الأوردر الأخيرة (24 ساعة)</button>
    <button class="btn danger" id="resetBtn" type="button">🗑️ بدء أوردر جديد</button>

</div>

<!-- Modal الأرشيف -->
<div class="modal hidden" id="mSheet"><div class="box">
  <h2>📜 ورقة الأوردر</h2>
  <div id="sheetBody"></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" data-close type="button">إغلاق</button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const firebaseConfig = {
  apiKey: "AIzaSyBfOJPkWbmcJ6s29bDNysr-H0Kx-Js3Gy0",
  authDomain: "am--rewards.firebaseapp.com",
  databaseURL: "https://am--rewards-default-rtdb.firebaseio.com",
  projectId: "am--rewards",
  storageBucket: "am--rewards.firebasestorage.app",
  messagingSenderId: "744783579735",
  appId: "1:744783579735:web:45e00de9998893bbc9b112"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEALS = {
  breakfast: {label:'الفطار', icon:'🥪', doc:'active_breakfast'},
  dinner:    {label:'العشاء / الغداء', icon:'🍔', doc:'active_dinner'}
};
let meal = 'breakfast', unsub = null, tab = 'cashier';
let state = {items:[]};
const payChoice = {}; 
let empType = 'sandwich';
let editingId = null;
let isSummaryCalculated = false;

const localStore = {
  get(m){
    try { return JSON.parse(localStorage.getItem('radar_meal_' + m)) || {items:[]}; }
    catch(e){ return {items:[]}; }
  },
  set(m, data){
    try { localStorage.setItem('radar_meal_' + m, JSON.stringify(data)); }
    catch(e){}
  }
};

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2200);
  setTimeout(() => t.remove(), 2600);
}
function openM(id){ $(id).classList.remove('hidden'); }
function closeM(id){ $(id).classList.add('hidden'); }
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); });
  m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => m.classList.add('hidden')));
});

async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ---------- Firebase Firestore ---------- */
const ref = (m) => db.collection('work_orders').doc(MEALS[m || meal].doc);

function listen(){
  if (unsub){ unsub(); unsub = null; }
  state = localStore.get(meal);
  render();

  try {
    unsub = ref().onSnapshot(
      snap => { 
        if (snap.exists && Array.isArray(snap.data().items)){
          state = {items: snap.data().items};
          localStore.set(meal, state);
          render();
          if (isSummaryCalculated) calculateAndDisplaySummary();
        }
      },
      err => { console.warn('Firebase notice:', err); }
    );
  } catch(e) {}
}

async function mutate(fn){
  const next = fn(state);
  state = next;
  localStore.set(meal, state);
  render();
  if (isSummaryCalculated) calculateAndDisplaySummary();

  try {
    const r = ref();
    await r.set({
      items: next.items,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  } catch(e) {
    console.warn('Saved locally:', e);
  }
}

/* ---------- نظام التجميع الرياضي الدقيق المحسّن للفطار والعشاء ---------- */
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toEn = s => String(s).replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace(/٫/g,'.');

// توحيد الحروف العربية والتنظيف
function cleanItemName(s){
  return s.replace(/[أإآ]/g,'ا')
          .replace(/ى/g,'ي')
          .replace(/ة/g,'ه')
          .replace(/ـ/g,'')
          .replace(/\s+/g,' ')
          .trim();
}

// مفتاح المقارنة الصارم
const keyOf = s => cleanItemName(s).toLowerCase();

// تقسيم الجمل بدقة عالية بدون تكسير أسماء الأصناف
function splitSegs(t){
  return toEn(t)
    .split(/[,،\n+؛;]|\s+و\s+/)
    .map(s => s.trim())
    .filter(Boolean);
}

function parseSand(text){
  return splitSegs(text).map(seg => {
    // حالة: 2 فول أو 2فول
    let m = seg.match(/^(\d+)\s*(?:x|×|-)?\s*(.*)$/i);
    if (m && m[2].trim()) return {qty: +m[1], name: cleanItemName(m[2])};
    
    // حالة: فول x 2
    m = seg.match(/^(.*?)\s*(?:x|×|-)\s*(\d+)$/i);
    if (m && m[1].trim()) return {qty: +m[2], name: cleanItemName(m[1])};
    
    // بدون رقم صريح (يتحسب 1)
    return {qty: 1, name: cleanItemName(seg)};
  });
}

function parseBulk(text){
  return splitSegs(text).map(seg => {
    let clean = seg.replace(/^ب\u0640*\s*(?=\d)/, '').trim();
    
    // حالة: بـ 15 فول أو 15 جنيه فول
    let m = clean.match(/^(\d+(?:\.\d+)?)\s*(?:جنيه|جنية|ج|egp)?\s*(.*)$/i);
    if (m && m[2].trim()) return {amt: +m[1], name: cleanItemName(m[2])};
    
    // حالة: فول 15 جنيه
    m = clean.match(/^(.*?)\s*(\d+(?:\.\d+)?)\s*(?:جنيه|جنية|ج|egp)?$/i);
    if (m && m[1].trim()) return {amt: +m[2], name: cleanItemName(m[1])};
    
    // حالة: 5 عيش (تتحسب كعدد لو مفيش لفظ جنيه)
    let mCount = seg.match(/^(\d+)\s*(.*)$/);
    if (mCount && mCount[2].trim()){
      return {amt: 0, countQty: +mCount[1], name: cleanItemName(mCount[2])};
    }
    
    return {amt: 0, name: cleanItemName(seg)};
  });
}

function aggregate(items){
  const sand = new Map(), bulk = new Map(), unknown = [];

  items.forEach(it => {
    if (it.sandText){
      parseSand(it.sandText).forEach(p => {
        const k = keyOf(p.name);
        const e = sand.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        sand.set(k, e);
      });
    }

    if (it.bulkText){
      parseBulk(it.bulkText).forEach(p => {
        if (p.amt > 0){
          const k = keyOf(p.name);
          const e = bulk.get(k) || {name: p.name, amt: 0};
          e.amt += p.amt;
          bulk.set(k, e);
        } else if (p.countQty){
          // لو طلب عيش بالعدد جوه العلب
          const k = keyOf(p.name);
          const e = sand.get(k) || {name: p.name, qty: 0};
          e.qty += p.countQty;
          sand.set(k, e);
        } else {
          unknown.push(p.name + ' (' + it.name + ')');
        }
      });
    }
  });

  return {
    sand: [...sand.values()].sort((a,b) => b.qty - a.qty),
    bulk: [...bulk.values()].sort((a,b) => b.amt - a.amt),
    unknown
  };
}

const fmt = n => (Math.round(n * 100) / 100).toLocaleString('en-US');

function buildSummary(){
  const a = aggregate(state.items);
  const d = new Date().toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});
  let t = MEALS[meal].icon + ' طلب ' + MEALS[meal].label + ' - ' + d + '\n';
  
  const titleCategory = meal === 'dinner' ? 'الوجبات والأصناف:' : 'السندوتشات والعيش:';
  const unitLabel = meal === 'dinner' ? ' صنف / وجبة' : ' طلب / سندوتش';

  if (a.sand.length){
    t += '\n' + (meal === 'dinner' ? '🍔 ' : '🥪 ') + titleCategory + '\n' + a.sand.map(s => '• ' + s.qty + ' ' + s.name).join('\n') + '\n';
    t += 'الإجمالي: ' + a.sand.reduce((x,s) => x + s.qty, 0) + unitLabel + '\n';
  }
  if (a.bulk.length){
    t += '\n🥡 العلب والأكياس بالجنيه:\n' + a.bulk.map(b => '• ' + b.name + ': إجمالي ' + fmt(b.amt) + ' جنيه').join('\n') + '\n';
    t += 'الإجمالي: ' + fmt(a.bulk.reduce((x,b) => x + b.amt, 0)) + ' جنيه\n';
  }
  if (a.unknown.length) t += '\n⚠️ بدون تحديد واضح:\n' + a.unknown.map(u => '• ' + u).join('\n') + '\n';
  return t.trim();
}

/* ---------- التبديل الديناميكي بين الفطار والعشاء ---------- */
function updateMealUI(){
  const isDinner = (meal === 'dinner');
  $('typeSegContainer').classList.toggle('hidden', isDinner);
  $('boxBulk').classList.toggle('hidden', isDinner || empType === 'sandwich');

  if (isDinner){
    $('lblSand').textContent = 'تفاصيل الوجبات والطلبات';
    $('fSand').placeholder = 'مثال: 1 كشري لارج زيادة دقة، 1 وجبة ربع صدر، 2 شاورما سوري، حواوشي';
  } else {
    $('lblSand').textContent = 'السندوتشات (بالعدد)';
    $('fSand').placeholder = '2 فول زيت حار، 1 طعمية محشية';
    setOrderTypeUI(empType);
  }
}

/* ---------- العرض والواجهة ---------- */
function render(){
  document.querySelectorAll('.meals button').forEach(b => b.classList.toggle('on', b.dataset.meal === meal));
  const n = state.items.length;
  $('orderCountBadge').textContent = n + ' موظفين مسجلين';
  
  $('tb-cashier').classList.toggle('on', tab === 'cashier');
  $('tb-deliver').classList.toggle('on', tab === 'deliver');
  $('tb-all').classList.toggle('on', tab === 'all');
  
  $('paneCashier').classList.toggle('hidden', tab !== 'cashier');
  $('paneDeliver').classList.toggle('hidden', tab !== 'deliver');
  $('paneAll').classList.toggle('hidden', tab !== 'all');
  
  if (tab === 'deliver') renderDeliver();
  if (tab === 'all') renderAllOrders();
}

/* ---------- حساب وعرض الملخص عند الضغط فقط ---------- */
function calculateAndDisplaySummary(){
  isSummaryCalculated = true;
  const p = $('summaryResultsContainer');
  if (!state.items.length){
    p.innerHTML = '<div class="card empty">📭 لسه مفيش موظفين متسجلين في أوردر ' + esc(MEALS[meal].label) + '.</div>';
    return;
  }
  const a = aggregate(state.items);
  let h = '';
  const titleCategory = meal === 'dinner' ? '🍔 الوجبات والأصناف' : '🥪 السندوتشات والعيش';
  const unitLabel = meal === 'dinner' ? ' صنف / وجبة' : ' طلب / سندوتش';

  if (a.sand.length){
    h += '<div class="card"><h2>' + titleCategory + '</h2><ul class="agg">' +
      a.sand.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + '</b></li>').join('') +
      '</ul><div class="total">الإجمالي: ' + a.sand.reduce((x,s) => x + s.qty, 0) + unitLabel + '</div></div>';
  }
  if (a.bulk.length){
    h += '<div class="card"><h2>🥡 العلب والأكياس (بالجنيه)</h2><ul class="agg">' +
      a.bulk.map(b => '<li><span>' + esc(b.name) + '</span><b>إجمالي ' + fmt(b.amt) + ' جنيه</b></li>').join('') +
      '</ul><div class="total">الإجمالي: ' + fmt(a.bulk.reduce((x,b) => x + b.amt, 0)) + ' جنيه</div></div>';
  }
  if (a.unknown.length){
    h += '<div class="card"><h2>⚠️ بدون تحديد واضح</h2><ul class="agg">' +
      a.unknown.map(u => '<li><span>' + esc(u) + '</span></li>').join('') + '</ul></div>';
  }
  h += '<div class="row" style="margin-bottom:14px"><button class="btn" id="copySum" type="button">📋 نسخ ملخص المطعم</button>' +
       '<button class="btn ok" id="waSum" type="button">💬 إرسال للمطعم عبر واتساب</button></div>';
  p.innerHTML = h;
  $('copySum').onclick = async () => toast(await copyText(buildSummary()) ? '📋 تم نسخ الملخص' : '❌ تعذر النسخ', 'info');
  $('waSum').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(buildSummary()), '_blank', 'noopener');
}

$('btnCalculateSummary').addEventListener('click', () => {
  calculateAndDisplaySummary();
  toast('📊 تم تجميع وحساب جميع الطلبات بنجاح!', 'info');
});

/* ---------- وقت التوزيع (سريع وبدون ثقل) ---------- */
function renderDeliver(){
  const p = $('paneDeliver');
  const all = state.items, left = all.filter(i => !i.delivered);
  if (!all.length){
    p.innerHTML = '<div class="card empty">📭 مفيش طلبات للتوزيع لسه.</div>';
    return;
  }
  if (!left.length){
    p.innerHTML = '<div class="card party">🎉 عاش! كل الناس استلمت وحاسبت والأوردر اتقفل بنجاح</div>';
    return;
  }
  let h = '<div class="counter">متبقي ' + left.length + ' عمال لم يستلموا</div>';
  left.forEach(it => {
    const pc = payChoice[it.id] || 'cash';
    let detailsHtml = '';
    if (it.sandText) detailsHtml += (meal === 'dinner' ? '🍔 ' : '🥪 ') + esc(it.sandText) + '<br>';
    if (it.bulkText) detailsHtml += '🥡 ' + esc(it.bulkText);

    h += '<div class="card wcard" data-id="' + esc(it.id) + '">' +
      '<div class="name">' +
        '<span>👤 ' + esc(it.name) + '</span>' +
        '<div class="card-actions">' +
          '<button class="btn-icon" title="تعديل هذا الطلب" onclick="loadWorkerForEdit(\'' + esc(it.id) + '\')">✏️</button>' +
          '<button class="btn-icon del" title="حذف هذا الطلب" onclick="deleteWorker(\'' + esc(it.id) + '\')">🗑️</button>' +
        '</div>' +
      '</div>' +
      '<div class="items">' + detailsHtml + '</div>' +
      '<div class="pays"><button type="button" class="pill ' + (pc === 'cash' ? 'on' : '') + '" data-pay="cash">💵 كاش</button>' +
      '<button type="button" class="pill ' + (pc === 'instapay' ? 'on' : '') + '" data-pay="instapay">📱 إنستاباي</button></div>' +
      '<button type="button" class="btn ok" style="width:100%" data-deliver>استلم وحاسب ✔</button></div>';
  });
  p.innerHTML = h;

  p.querySelectorAll('.wcard').forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
      payChoice[id] = b.dataset.pay;
      card.querySelectorAll('[data-pay]').forEach(x => x.classList.toggle('on', x === b));
    });
    card.querySelector('[data-deliver]').onclick = ev => {
      ev.currentTarget.disabled = true;
      const pay = payChoice[id] || 'cash';
      card.classList.add('fade');
      setTimeout(async () => {
        await mutate(cur => {
          const it = cur.items.find(x => x.id === id);
          if (it){ it.delivered = true; it.payment = pay; it.deliveredAt = Date.now(); }
          return cur;
        });
      }, 150);
    };
  });
}

/* ---------- تبويب كل الأوردرات والتعديل الشامل ---------- */
function renderAllOrders(){
  const p = $('paneAll');
  if (!state.items.length){
    p.innerHTML = '<div class="card empty">📭 لا يوجد أي أوردرات مسجلة حتى الآن.</div>';
    return;
  }
  let h = '';
  state.items.forEach(it => {
    let detailsHtml = '';
    if (it.sandText) detailsHtml += (meal === 'dinner' ? '🍔 ' : '🥪 ') + esc(it.sandText) + '<br>';
    if (it.bulkText) detailsHtml += '🥡 ' + esc(it.bulkText);

    const statusBadge = it.delivered 
      ? '<span class="badge done">✔ استلم (' + (it.payment === 'instapay' ? '📱 إنستاباي' : '💵 كاش') + ')</span>'
      : '<span class="badge wait">⏳ لم يستلم بعد</span>';

    h += '<div class="card" style="margin-bottom:10px; padding:14px;">' +
      '<div class="name">' +
        '<span>👤 ' + esc(it.name) + ' ' + statusBadge + '</span>' +
        '<div class="card-actions">' +
          '<button class="btn-icon" title="تعديل هذا الطلب" onclick="loadWorkerForEdit(\'' + esc(it.id) + '\')">✏️</button>' +
          '<button class="btn-icon del" title="حذف هذا الطلب" onclick="deleteWorker(\'' + esc(it.id) + '\')">🗑️</button>' +
        '</div>' +
      '</div>' +
      '<div class="items" style="margin-top:8px;">' + detailsHtml + '</div>' +
    '</div>';
  });
  p.innerHTML = h;
}

/* ---------- دالة تحميل الموظف للتعديل عند الضغط على ✏️ ---------- */
function loadWorkerForEdit(id){
  const it = state.items.find(x => x.id === id);
  if (!it) return;

  editingId = id;
  $('fName').value = it.name;
  $('fSand').value = it.sandText || '';
  $('fBulk').value = it.bulkText || '';

  if (meal === 'breakfast'){
    empType = it.type || 'sandwich';
    setOrderTypeUI(empType);
  }

  $('formTitle').textContent = '✏️ تعديل طلب (' + it.name + ')';
  $('savePersonBtn').textContent = '💾 حفظ التعديل';
  $('savePersonBtn').className = 'btn warn';

  $('formCard').scrollIntoView({ behavior: 'smooth' });
  $('fName').focus();
  toast('✏️ جاري تعديل طلب: ' + it.name, 'info');
}

// دالة حذف موظف مسجل
async function deleteWorker(id){
  if (!confirm('هل تريد حذف هذا الطلب من القائمة؟')) return;
  if (editingId === id) resetFormToNew();
  await mutate(cur => {
    cur.items = cur.items.filter(x => x.id !== id);
    return cur;
  });
  toast('🗑️ تم حذف الطلب بنجاح', 'info');
}

/* ---------- ضبط واجهة نوع الطلب ---------- */
function setOrderTypeUI(type){
  $('typeSeg').querySelectorAll('button').forEach(btn => btn.classList.toggle('on', btn.dataset.type === type));
  if (type === 'sandwich'){
    $('boxSand').classList.remove('hidden');
    $('boxBulk').classList.add('hidden');
  } else if (type === 'bulk'){
    $('boxSand').classList.add('hidden');
    $('boxBulk').classList.remove('hidden');
  } else if (type === 'mixed'){
    $('boxSand').classList.remove('hidden');
    $('boxBulk').classList.remove('hidden');
  }
}

$('typeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  empType = b.dataset.type;
  setOrderTypeUI(empType);
});

// إعادة الفورم للوضع الافتراضي للشخص الجديد
function resetFormToNew(){
  editingId = null;
  $('fName').value = '';
  $('fSand').value = '';
  $('fBulk').value = '';
  $('formTitle').textContent = '➕ تسجيل طلب موظف';
  $('savePersonBtn').textContent = '💾 حفظ الطلب';
  $('savePersonBtn').className = 'btn ok';
  $('fName').focus();
}

/* ---------- حفظ الطلب والتفريغ الفوري للشخص التالي ---------- */
$('savePersonBtn').addEventListener('click', async () => {
  const name = $('fName').value.trim();
  const sandText = $('fSand').value.trim();
  const bulkText = $('fBulk').value.trim();

  if (!name) return toast('⚠️ اكتب اسم الموظف الأول', 'error');

  if (meal === 'dinner'){
    if (!sandText) return toast('⚠️ اكتب تفاصيل وجبة أو طلب الموظف', 'error');
  } else {
    if (empType === 'sandwich' && !sandText) return toast('⚠️ اكتب السندوتشات المطلوبة', 'error');
    if (empType === 'bulk' && !bulkText) return toast('⚠️ اكتب العلب المطلوبة', 'error');
    if (empType === 'mixed' && !sandText && !bulkText) return toast('⚠️ اكتب تفاصيل السندوتشات أو العلب', 'error');
  }

  const btn = $('savePersonBtn'); 
  btn.disabled = true;

  try{
    if (editingId){
      // وضع تعديل موظف قائم
      await mutate(cur => {
        cur.items = cur.items.map(x => {
          if (x.id === editingId){
            return {
              ...x,
              name,
              type: meal === 'dinner' ? 'dinner' : empType,
              sandText: (meal === 'dinner' || empType === 'sandwich' || empType === 'mixed') ? sandText : '',
              bulkText: (meal === 'breakfast' && (empType === 'bulk' || empType === 'mixed')) ? bulkText : ''
            };
          }
          return x;
        });
        return cur;
      });
      toast('✅ تم تحديث طلب (' + name + ') بنجاح!');
      resetFormToNew();
    } else {
      // وضع إضافة موظف جديد
      const newId = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const newItem = {
        id: newId,
        name,
        type: meal === 'dinner' ? 'dinner' : empType,
        sandText: (meal === 'dinner' || empType === 'sandwich' || empType === 'mixed') ? sandText : '',
        bulkText: (meal === 'breakfast' && (empType === 'bulk' || empType === 'mixed')) ? bulkText : '',
        delivered: false,
        payment: '',
        createdAt: Date.now()
      };

      await mutate(cur => {
        cur.items = cur.items.concat([newItem]);
        return cur;
      });

      // تفريغ فوري للخانات والتركيز التلقائي على خانة الاسم للشخص اللي بعده!
      resetFormToNew();
      toast('💾 تم حفظ (' + name + ')! اكتب الشخص اللي بعده.');
    }
  }catch(e){
    console.error(e);
    toast('❌ حصلت مشكلة في الحفظ', 'error');
  }finally{
    btn.disabled = false;
  }
});

/* ---------- تبديل التبويبات والوجبة ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { 
  tab = b.dataset.tab; 
  render(); 
}));

document.querySelectorAll('.meals button').forEach(b => b.addEventListener('click', () => {
  if (meal === b.dataset.meal) return;
  meal = b.dataset.meal; 
  resetFormToNew();
  isSummaryCalculated = false;
  $('summaryResultsContainer').innerHTML = '<div class="card empty">اضغط على الزرار بالأعلى لتجميع وحساب إجمالي الأصناف والفلوس.</div>';
  updateMealUI();
  listen();
}));

/* ---------- بدء أوردر جديد ---------- */
$('resetBtn').addEventListener('click', async () => {
  if (!confirm('متأكد إنك عايز تبدأ أوردر جديد؟\nهيتم أرشفة الأوردر الحالي وتفريغ القائمة.')) return;
  try{
    const m = meal, cur = state;
    if (cur.items.length){
      try {
        await db.collection('work_orders_archive').add({
          meal: m, 
          items: cur.items, 
          archivedAt: firebase.firestore.FieldValue.serverTimestamp(), 
          archivedMs: Date.now()
        });
      } catch(e){}
    }
    resetFormToNew();
    isSummaryCalculated = false;
    $('summaryResultsContainer').innerHTML = '<div class="card empty">اضغط على الزرار بالأعلى لتجميع وحساب إجمالي الأصناف والفلوس.</div>';
    await mutate(c => ({items:[]}));
    toast('🗑️ تم تفريغ الأوردر وبدء جلسة جديدة');
  }catch(e){ toast('❌ مشكلة في التعيين', 'error'); }
});

/* ---------- سجل 24 ساعة ---------- */
function sheetHtml(items){
  return items.map(it => {
    const st = it.delivered
      ? '<span class="ok-t">✔ استلم (' + (it.payment === 'instapay' ? '📱 إنستاباي' : '💵 كاش') + ')</span>'
      : '<span class="wait-t">⏳ لم يستلم</span>';
    let det = (it.sandText ? (meal === 'dinner' ? '🍔 ' : '🥪 ') + it.sandText + ' ' : '') + (it.bulkText ? '🥡 ' + it.bulkText : '');
    return '<div class="sheet-row"><b>' + esc(it.name) + '</b> — ' + st + '<br><span class="muted">' + esc(det) + '</span></div>';
  }).join('');
}

$('sheetBtn').addEventListener('click', async () => {
  const body = $('sheetBody');
  body.innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';
  openM('mSheet');
  let h = '<h2 style="color:var(--primary-neon)">الأوردر الحالي</h2>' +
    (state.items.length ? sheetHtml(state.items) : '<div class="empty">لا توجد طلبات حالية</div>');
  try{
    const snap = await db.collection('work_orders_archive').where('meal','==',meal).get();
    const cutoff = Date.now() - 24*60*60*1000;
    const rows = snap.docs.map(d => d.data()).filter(d => (d.archivedMs || 0) >= cutoff).sort((a,b) => b.archivedMs - a.archivedMs);
    h += '<h2 style="margin-top:16px;color:var(--secondary-neon)">أوردرات آخر 24 ساعة</h2>';
    h += rows.length ? rows.map(r => '<div class="muted" style="margin-top:8px">' +
      new Date(r.archivedMs).toLocaleString('ar-EG') + '</div>' + sheetHtml(r.items || [])).join('')
      : '<div class="empty">لا يوجد أوردرات سابقة في آخر 24 ساعة</div>';
  }catch(e){
    h += '<div class="empty muted">عرض السجل المحلي للأوردر الحالي فقط</div>';
  }
  body.innerHTML = h;
});

/* ---------- تشغيل البرنامج وضبط الواجهة ---------- */
updateMealUI();
listen();
</script>
</body>
</html>
