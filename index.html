<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار أوردرات الشغل (أداة المشرف)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#0b0f19;--bg-secondary:#131a26;--card-bg:#1a2332;
  --text-color:#f3f4f6;--text-secondary:#b0b8c6;
  --primary-neon:#00f2fe;--secondary-neon:#4facfe;--accent-purple:#7f00ff;
  --danger-color:#ff4757;--success-color:#2ed573;--warning-color:#ffa502;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Inter',sans-serif;background:var(--bg-color);color:var(--text-color);min-height:100vh;
  background-image:radial-gradient(circle at 85% -10%,rgba(127,0,255,.22),transparent 45%),radial-gradient(circle at 10% 110%,rgba(0,242,254,.14),transparent 45%);
  background-attachment:fixed;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}

/* Header */
.main-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.main-header h1{font-size:1.3rem;font-weight:900;color:var(--primary-neon);text-shadow:0 0 14px rgba(0,242,254,.55);margin:0}
h2{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.hidden{display:none!important}

/* Meals Switch */
.meals{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg-secondary);padding:6px;border-radius:16px;border:1px solid rgba(79,172,254,.25);margin-bottom:16px}
.meals button{font:inherit;font-weight:700;padding:11px 6px;border:0;border-radius:12px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:.25s}
.meals button.on{background:linear-gradient(135deg,var(--primary-neon),var(--secondary-neon));color:#04121a;box-shadow:0 0 18px rgba(0,242,254,.5)}

/* Cards */
.card{background:rgba(26,35,50,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,242,254,.28);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(127,0,255,.08),0 8px 28px rgba(0,0,0,.35);transition:.3s}
.muted{color:var(--text-secondary);font-size:.9rem}
.empty{text-align:center;color:var(--text-secondary);padding:26px 8px}

/* Inputs */
label{display:block;font-weight:600;margin:12px 0 6px;font-size:.95rem}
input[type=text],textarea{width:100%;font:inherit;color:var(--text-color);background:var(--bg-secondary);border:1px solid rgba(79,172,254,.35);border-radius:12px;padding:11px 13px;outline:none;transition:.25s}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{border-color:var(--primary-neon);box-shadow:0 0 12px rgba(0,242,254,.4)}

/* شريط الاختصارات المودرن */
.shortcuts-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;background:rgba(19,26,38,.85);border:1px solid rgba(0,242,254,.2);border-radius:12px;padding:8px 12px;margin:8px 0 12px}
.sc-tag{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;color:var(--text-secondary)}
.sc-key{background:rgba(0,242,254,.15);color:var(--primary-neon);border:1px solid var(--primary-neon);padding:2px 7px;border-radius:6px;font-weight:900;font-size:.82rem;box-shadow:0 0 8px rgba(0,242,254,.3)}
.sc-default{color:var(--warning-color);font-size:.78rem;font-weight:600;width:100%;text-align:center;margin-top:4px}

/* Buttons */
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;cursor:pointer;color:#04121a;background:linear-gradient(135deg,var(--primary-neon),var(--secondary-neon));transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(0,242,254,.6)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent;color:var(--text-color);border:1px solid rgba(79,172,254,.45)}
.btn.danger{background:transparent;color:var(--danger-color);border:1px solid var(--danger-color)}
.btn.danger-filled{background:var(--danger-color);color:#fff}
.btn.danger-filled:hover{box-shadow:0 0 16px rgba(255,71,87,.6)}
.btn.ok{background:linear-gradient(135deg,var(--success-color),#26d0a0);color:#04121a}
.btn.warn{background:linear-gradient(135deg,var(--warning-color),#ffc048);color:#04121a}

.btn-top-reset{background:rgba(255,71,87,.15);border:1px solid var(--danger-color);color:var(--danger-color);padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn-top-reset:hover{background:var(--danger-color);color:#fff;box-shadow:0 0 12px rgba(255,71,87,.5)}

.card-actions{display:flex;align-items:center;gap:4px}
.btn-icon{background:transparent;border:none;font-size:1.05rem;cursor:pointer;padding:4px 6px;border-radius:8px;transition:.2s}
.btn-icon:hover{background:rgba(255,255,255,.1)}
.btn-icon.del:hover{background:rgba(255,71,87,.2)}

.row{display:flex;flex-wrap:wrap;gap:8px}
.row>.btn{flex:1 1 140px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:.9rem;border:1px solid}
.badge.open{color:var(--success-color);border-color:var(--success-color);background:rgba(46,213,115,.1)}
.badge.done{color:var(--success-color);border-color:var(--success-color);background:rgba(46,213,115,.2);font-size:.8rem}
.badge.wait{color:var(--warning-color);border-color:var(--warning-color);background:rgba(255,165,2,.2);font-size:.8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}

/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:16px 0 14px}
.tabs button{font:inherit;font-weight:700;padding:11px 4px;border-radius:12px;border:1px solid rgba(127,0,255,.5);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:.2s;font-size:.85rem}
.tabs button.on{background:linear-gradient(135deg,var(--accent-purple),var(--secondary-neon));color:#fff;box-shadow:0 0 16px rgba(127,0,255,.5)}

/* Lists */
.agg{list-style:none}
.agg li{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(176,184,198,.2)}
.agg li:last-child{border:0}
.agg b{color:var(--primary-neon);white-space:nowrap}

.alert-dup{background:rgba(255,71,87,.15);border:1px solid var(--danger-color);border-radius:12px;padding:12px;margin-bottom:14px;color:#ffd5d9;font-size:.9rem}
.alert-dup b{color:var(--danger-color)}

/* Worker Cards */
.wcard{transition:opacity .15s ease, transform .15s ease}
.wcard.fade{opacity:0;transform:scale(0.92);pointer-events:none}
.wcard .name{font-weight:900;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.wcard .items{background:var(--bg-secondary);border-radius:10px;padding:9px 12px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pill{font:inherit;font-weight:600;padding:8px 4px;border-radius:10px;border:1px solid rgba(79,172,254,.35);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:.2s;font-size:.85rem}
.pill.on{border-color:var(--primary-neon);color:var(--primary-neon);background:rgba(0,242,254,.1)}
.counter{text-align:center;font-weight:700;color:var(--warning-color);margin-bottom:12px}
.party{text-align:center;border-color:var(--success-color);box-shadow:0 0 28px rgba(46,213,115,.4);font-size:1.15rem;font-weight:900;padding:28px 14px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,8,14,.78);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal .box{background:var(--card-bg);border:1px solid var(--primary-neon);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 0 28px rgba(0,242,254,.35)}
@media(min-width:600px){.modal{align-items:center}.modal .box{border-radius:20px}}
.sheet-row{padding:9px 0;border-bottom:1px dashed rgba(176,184,198,.2)}
.sheet-row .ok-t{color:var(--success-color)}.sheet-row .wait-t{color:var(--warning-color)}

/* Toast */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card-bg);border:1px solid var(--success-color);border-radius:14px;padding:11px 14px;font-weight:700;text-align:center;box-shadow:0 0 18px rgba(46,213,115,.4);animation:tin .3s;transition:.4s}
.toast.error{border-color:var(--danger-color);box-shadow:0 0 18px rgba(255,71,87,.4)}
.toast.info{border-color:var(--secondary-neon);box-shadow:0 0 18px rgba(79,172,254,.4)}
.toast.out{opacity:0;transform:translateY(-12px)}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
</style>
</head>

<div id="toasts" aria-live="polite"></div>
<div class="wrap">
  
  <header class="main-header">
    <h1>📡 رادار أوردرات الشغل</h1>
    <button class="btn btn-top-reset" id="resetBtnTop" type="button">🗑️ بدء أوردر جديد</button>

    <div class="row" style="margin-top:14px">
      <button class="btn ok" id="savePersonBtn" type="button" style="width:100%; padding:13px;">💾 حفظ الطلب</button>
    </div>
  </div>

  <!-- التبويبات الثلاثة -->
  <div class="tabs">
    <button id="tb-cashier" data-tab="cashier" class="on">جمع الطلبات 📊</button>

  </div>

  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="sheetBtn" type="button" style="width:100%">📜 ورقة الأوردر الأخيرة (24 ساعة)</button>
  </div>
</div>

<!-- Modal الأرشيف مع زر الحذف النهائي -->
<div class="modal hidden" id="mSheet"><div class="box">
  <div class="top">

    <button class="btn btn-icon del" data-close style="font-size:1.2rem;">✖</button>

const localStore = {
  get(m){
    try { return JSON.parse(localStorage.getItem('radar_meal_' + m)) || {items:[]}; }

  },
  set(m, data){

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2200);
  setTimeout(() => t.remove(), 2600);
}
function openM(id){ $(id).classList.remove('hidden'); }
function closeM(id){ $(id).classList.add('hidden'); }
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); });
  m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => m.classList.add('hidden')));
});

async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ---------- Firebase Firestore ---------- */
const ref = (m) => db.collection('work_orders').doc(MEALS[m || meal].doc);

function listen(){
  if (unsub){ unsub(); unsub = null; }
  state = localStore.get(meal);
  render();

  try {
    unsub = ref().onSnapshot(
      snap => { 
        if (snap.exists && Array.isArray(snap.data().items)){
          state = {items: snap.data().items};
          localStore.set(meal, state);
          render();
          if (isSummaryCalculated) calculateAndDisplaySummary();
        }
      },
      err => { console.warn('Firebase notice:', err); }
    );
  } catch(e) {}
}

async function mutate(fn){
  const next = fn(state);
  state = next;
  localStore.set(meal, state);
  render();
  if (isSummaryCalculated) calculateAndDisplaySummary();

  try {
    const r = ref();
    await r.set({
      items: next.items,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  } catch(e) {
    console.warn('Saved locally:', e);
  }
}

function cleanItemName(s){
  let clean = s.replace(/[أإآ]/g,'ا')
               .replace(/ى/g,'ي')
               .replace(/ة/g,'ه')
               .replace(/ـ/g,'')
               .replace(/\s+/g,' ')
               .trim();

  // توحيد المسميات والجمع والمفرد
  if (clean === 'بيضات' || clean === 'بيضه' || clean === 'بيضة') clean = 'بيض';
  if (clean === 'سيبسي' || clean === 'شيبس') clean = 'شيبسي';
  if (clean === 'كنز') clean = 'كانز';
  if (clean === 'طعميه') clean = 'طعمية';
  if (clean === 'مسقعه') clean = 'مسقعة';
  return clean;
}

const keyOf = s => cleanItemName(s).toLowerCase();

function smartSplit(t){
  let normalized = toEn(t).replace(/\r\n/g, '\n');
  normalized = normalized.replace(/(\d+)\s*([أ-يa-zA-Z])/g, '$1 $2');
  normalized = normalized.replace(/[\+_\/,\u060C\u061B;؛\-]+/g, '\n');
  normalized = normalized.replace(/\s+و\s+/g, '\n');
  // فصل الواو الملتصقة بالكلمات الشائعة
  normalized = normalized.replace(/(?:^|\n|\s)و(\d+)/g, '\n$1');
  normalized = normalized.replace(/(?:^|\n|\s)و(كنز|كانز|شيبسي|سيبسي|فول|طعمية|طعميه|بيض|بطاطس|مسقعة|مسقعه|بتنجان|باذنجان|سجاير|عسل|فطير|جبنة|جبنه|لانشون|نسكافيه)/g, '\n$1');
  normalized = normalized.replace(/([^\d\n])\s+(\d+)/g, '$1\n$2');
  return normalized.split('\n').map(s => s.trim()).filter(Boolean);
}

// دالة فحص وتصنيف كل صنف بدقة صارمة
function parseRawItem(seg, isBreakfast){
  seg = toEn(seg).trim();
  if (!seg) return null;

  // استبعاد الأرقام التائهة بمفردها
  if (/^\d+$/.test(seg.replace(/\s+/g, ''))) return null;

  let priceNote = '';
  // استخراج فئة السعر (مثل: ب 10 أو بـ 25)
  let mPrice = seg.match(/^(.*?)\s*(?:ب\u0640*|\s+ب\s+)(\d+(?:\.\d+)?)\s*(?:جنيه|جنية|ج)?$/i);
  if (mPrice && mPrice[1].trim()){
    seg = mPrice[1].trim();
    priceNote = ' (فئة ' + mPrice[2] + ' جنيه)';
  }

  seg = seg.replace(/\s+ب\u0640*$/i, '').trim();
  seg = seg.replace(/\b(?:كيس|اكياس|أكياس)\b/gi, '').replace(/\s+/g, ' ').trim();
  seg = seg.replace(/^و\s*/, '').trim();

  let qty = 1;
  let unit = ''; // 'sand' (س), 'box' (ع), 'count' (د / x), 'loaf' (ر), 'money' (ج / بـ)

  // استخراج الرقم من البداية
  let mNum = seg.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
  let rest = seg;
  if (mNum){
    qty = +mNum[1];
    rest = mNum[2].trim();
  }

  // تنظيف دمج د مع ع مثل: 2 د ع جبنة
  let hasCountPrefix = rest.match(/^(?:د|عدد|x)\s+/i);
  if (hasCountPrefix){
    unit = 'count';
    rest = rest.replace(/^(?:د|عدد|x)\s+/i, '').trim();
  }

  // فحص وحدات الاختصار في البداية
  let mLoaf = rest.match(/^(?:ر|رغيف|ارغفة|أرغفة)\s+(.*)$/i) || rest.match(/^(?:ر|رغيف|ارغفة|أرغفة)$/i);
  if (mLoaf){ unit = 'loaf'; rest = (mLoaf[1] || '').trim(); }

  let mSand = rest.match(/^(?:س|سندوتش|ساندوتش|سندوتشات)\s+(.*)$/i) || rest.match(/^(?:س|سندوتش|ساندوتش|سندوتشات)$/i);
  if (!unit && mSand){ unit = 'sand'; rest = (mSand[1] || '').trim(); }

  let mBox = rest.match(/^(?:ع|علبه|علبة|علب)\s+(.*)$/i) || rest.match(/^(?:ع|علبه|علبة|علب)$/i);
  if (mBox){ unit = 'box'; rest = (mBox[1] || '').trim(); }

  let mCount = rest.match(/^(?:د|عدد|x)\s+(.*)$/i) || rest.match(/^(?:د|عدد|x)$/i);
  if (!unit && mCount){ unit = 'count'; rest = (mCount[1] || '').trim(); }

  let mMoney = rest.match(/^(?:ج|جنيه|جنية|ب\u0640*)\s+(.*)$/i) || rest.match(/^(?:ج|جنيه|جنية)$/i);
  if (!unit && mMoney){ unit = 'money'; rest = (mMoney[1] || '').trim(); }

  // فحص وحدات الاختصار في النهاية
  if (!unit){
    let mEndLoaf = rest.match(/^(.*?)\s+(?:ر|رغيف)$/i);
    if (mEndLoaf){ unit = 'loaf'; rest = mEndLoaf[1].trim(); }
    let mEndSand = rest.match(/^(.*?)\s+(?:س|سندوتش|ساندوتش)$/i);
    if (!unit && mEndSand){ unit = 'sand'; rest = mEndSand[1].trim(); }
    let mEndBox = rest.match(/^(.*?)\s+(?:ع|علبه|علبة)$/i);
    if (!unit && mEndBox){ unit = 'box'; rest = mEndBox[1].trim(); }
    let mEndCount = rest.match(/^(.*?)\s+(?:د|عدد|x)$/i);
    if (!unit && mEndCount){ unit = 'count'; rest = mEndCount[1].trim(); }
    let mEndMoney = rest.match(/^(.*?)\s+(?:ج|جنيه|جنية)$/i);
    if (!unit && mEndMoney){ unit = 'money'; rest = mEndMoney[1].trim(); }
  }

  // تنظيف الحروف الملتصقة مثل (ع سجاير أو ع عسل) لضمان نظافة الاسم
  rest = rest.replace(/^[عسكجدر]\s+/i, '').trim();

  let clean = cleanItemName(rest || seg);
  if (!clean || /^\d+$/.test(clean)) return null;

  // 1. المخبز والفطاطري
  if (BAKERY_DICT.some(w => clean.includes(w))){
    return { shop: 'bakery', kind: unit === 'box' ? 'box' : 'count', qty, name: clean + priceNote };
  }

  // 2. السوبر ماركت
  if (SUPERMARKET_DICT.some(w => clean.includes(w))){
    if (clean.includes('جبنه') || clean.includes('جبنة') || clean.includes('لانشون') || clean.includes('رومي')){
      if (unit !== 'count' && unit !== 'sand' && unit !== 'box'){
        return { shop: 'supermarket', kind: 'money', amt: qty, name: clean + priceNote };
      }
    }
    return { shop: 'supermarket', kind: unit === 'box' ? 'box' : 'count', qty, name: clean + priceNote };
  }

  // 3. مطعم الفول والطعام الشعبي (الفطار)
  if (isBreakfast){
    if (RESTAURANT_BF_DICT.some(w => clean.includes(w))){
      
      // أولوية مطلقة للحرف الصريح أولاً:
      if (unit === 'sand') return { shop: 'bf_restaurant', kind: 'sand', qty, name: clean + priceNote };
      if (unit === 'box') return { shop: 'bf_restaurant', kind: 'box', qty, name: clean + priceNote };
      if (unit === 'loaf') return { shop: 'bf_restaurant', kind: 'bread', qty, name: 'عيش بلدي' + priceNote };
      if (unit === 'count') {
        if (clean === 'عيش' || clean === 'عيش بلدي') return { shop: 'bf_restaurant', kind: 'bread', qty, name: 'عيش بلدي' + priceNote };
        return { shop: 'bf_restaurant', kind: 'eggs', qty, name: clean + priceNote };
      }
      if (unit === 'money') return { shop: 'bf_restaurant', kind: 'money', amt: qty, name: clean + priceNote };

      // في حالة عدم كتابة أي حرف (القاعدة العامة):
      // البيض بطبيعته عدد إذا لم يُكتب س:
      if (clean === 'بيض'){
        return { shop: 'bf_restaurant', kind: 'eggs', qty, name: 'بيض' + priceNote };
      }

      // باقي الأصناف (فول، طعمية، مسقعة، بطاطس، بتنجان، عيش، مية سلطة) تحسب بالجنيه تلقائياً!
      return { shop: 'bf_restaurant', kind: 'money', amt: qty, name: (clean === 'عيش' ? 'عيش بلدي' : clean) + priceNote };
    }
  }

  // 4. محلات العشاء المتخصصة
  if (!isBreakfast){
    if (KOSHARY_DICT.some(w => clean.includes(w))) return { shop: 'dinner_koshary', kind: 'count', qty, name: clean + priceNote };
    if (SYRIAN_DICT.some(w => clean.includes(w))) return { shop: 'dinner_syrian', kind: 'count', qty, name: clean + priceNote };
    if (GRILL_DICT.some(w => clean.includes(w))) return { shop: 'dinner_grill', kind: 'count', qty, name: clean + priceNote };
  }

  // 5. أصناف متفرقة غير محددة
  return { shop: 'unknown', kind: 'count', qty, name: clean + priceNote };
}

function aggregate(items){
  const isBreakfast = (meal === 'breakfast');

  const bfSand = new Map();
  const bfBoxes = new Map();
  const bfMoney = new Map();
  const bfBread = new Map();
  const bfEggs = new Map();

  const dinKoshary = new Map();
  const dinSyrian = new Map();
  const dinGrill = new Map();

  const supermarket = new Map();
  const supermarketMoney = new Map();
  const bakery = new Map();
  const unknown = new Map();

  items.forEach(it => {
    smartSplit(it.details || '').forEach(seg => {
      const p = parseRawItem(seg, isBreakfast);
      if (!p) return;

      const k = keyOf(p.name);

      if (p.shop === 'supermarket'){
        if (p.kind === 'money'){
          const e = supermarketMoney.get(k) || {name: p.name, amt: 0};
          e.amt += p.amt;
          supermarketMoney.set(k, e);
        } else {
          const e = supermarket.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          supermarket.set(k, e);
        }
      } else if (p.shop === 'bakery'){
        const e = bakery.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        bakery.set(k, e);
      } else if (p.shop === 'bf_restaurant'){
        if (p.kind === 'bread'){
          const e = bfBread.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          bfBread.set(k, e);
        } else if (p.kind === 'eggs'){
          const e = bfEggs.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          bfEggs.set(k, e);
        } else if (p.kind === 'money'){
          const e = bfMoney.get(k) || {name: p.name, amt: 0};
          e.amt += p.amt;
          bfMoney.set(k, e);
        } else if (p.kind === 'box'){
          const e = bfBoxes.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          bfBoxes.set(k, e);
        } else {
          const e = bfSand.get(k) || {name: p.name, qty: 0};
          e.qty += p.qty;
          bfSand.set(k, e);
        }
      } else if (p.shop === 'dinner_koshary'){
        const e = dinKoshary.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        dinKoshary.set(k, e);
      } else if (p.shop === 'dinner_syrian'){
        const e = dinSyrian.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        dinSyrian.set(k, e);
      } else if (p.shop === 'dinner_grill'){
        const e = dinGrill.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        dinGrill.set(k, e);
      } else {
        const e = unknown.get(k) || {name: p.name, qty: 0};
        e.qty += p.qty;
        unknown.set(k, e);
      }
    });
  });

  return {
    bfSand: [...bfSand.values()].sort((a,b) => b.qty - a.qty),
    bfBoxes: [...bfBoxes.values()].sort((a,b) => b.qty - a.qty),
    bfMoney: [...bfMoney.values()].sort((a,b) => b.amt - a.amt),
    bfBread: [...bfBread.values()].sort((a,b) => b.qty - a.qty),
    bfEggs: [...bfEggs.values()].sort((a,b) => b.qty - a.qty),
    dinKoshary: [...dinKoshary.values()].sort((a,b) => b.qty - a.qty),
    dinSyrian: [...dinSyrian.values()].sort((a,b) => b.qty - a.qty),
    dinGrill: [...dinGrill.values()].sort((a,b) => b.qty - a.qty),
    supermarket: [...supermarket.values()].sort((a,b) => b.qty - a.qty),
    supermarketMoney: [...supermarketMoney.values()].sort((a,b) => b.amt - a.amt),
    bakery: [...bakery.values()].sort((a,b) => b.qty - a.qty),
    unknown: [...unknown.values()].sort((a,b) => b.qty - a.qty)
  };
}

const fmt = n => (Math.round(n * 100) / 100).toLocaleString('en-US');

function buildSummary(){
  const a = aggregate(state.items);
  const isBreakfast = (meal === 'breakfast');
  const d = new Date().toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});
  let t = MEALS[meal].icon + ' فرز أوردر ' + MEALS[meal].label + ' - ' + d + '\n';

  if (isBreakfast){
    t += '\n🍽️ مطعم الفول والطعام الشعبي:\n';
    if (a.bfSand.length) t += a.bfSand.map(s => '• ' + s.qty + ' سندوتش ' + s.name).join('\n') + '\n';
    if (a.bfBoxes.length) t += a.bfBoxes.map(b => '• ' + b.qty + ' علبة ' + b.name).join('\n') + '\n';
    if (a.bfBread.length) t += a.bfBread.map(b => '• ' + b.qty + ' رغيف ' + b.name).join('\n') + '\n';
    if (a.bfEggs.length) t += a.bfEggs.map(e => '• ' + e.qty + ' عدد ' + e.name).join('\n') + '\n';
    if (a.bfMoney.length) t += a.bfMoney.map(m => '• ' + m.name + ': بـ ' + fmt(m.amt) + ' جنيه').join('\n') + '\n';
  } else {
    if (a.dinKoshary.length){
      t += '\n🥣 محل الكشري والطواجن:\n' + a.dinKoshary.map(s => '• ' + s.qty + ' ' + s.name).join('\n') + '\n';
    }
    if (a.dinSyrian.length){
      t += '\n🌯 المطعم السوري، الشاورما، الكريب والبروست:\n' + a.dinSyrian.map(s => '• ' + s.qty + ' ' + s.name).join('\n') + '\n';
    }
    if (a.dinGrill.length){
      t += '\n🥩 المشويات والحواوشي والفراخ:\n' + a.dinGrill.map(s => '• ' + s.qty + ' ' + s.name).join('\n') + '\n';
    }
  }

  if (a.supermarket.length || a.supermarketMoney.length){
    t += '\n🏪 السوبر ماركت والبقالة:\n';
    if (a.supermarket.length) t += a.supermarket.map(s => '• ' + s.qty + ' ' + s.name).join('\n') + '\n';
    if (a.supermarketMoney.length) t += a.supermarketMoney.map(m => '• ' + m.name + ': بـ ' + fmt(m.amt) + ' جنيه').join('\n') + '\n';
  }

  if (a.bakery.length){
    t += '\n🥐 المخبز والفطاطري:\n' + a.bakery.map(b => '• ' + b.qty + ' ' + b.name).join('\n') + '\n';
  }

  if (a.unknown.length){
    t += '\n🔍 أصناف متفرقة (راجع مكان شرائها):\n' + a.unknown.map(u => '• ' + u.qty + ' ' + u.name).join('\n') + '\n';
  }

  return t.trim();
}

function checkDuplicates(items){
  const map = new Map();
  const duplicates = [];

  items.forEach(it => {
    const orderFingerprint = keyOf(it.name) + '___' + cleanItemName(it.details || '');
    if (map.has(orderFingerprint)){
      duplicates.push({ name: it.name, details: it.details });
    } else {
      map.set(orderFingerprint, true);
    }
  });

  return duplicates;
}

  isSummaryCalculated = true;
  const p = $('summaryResultsContainer');
  const dupContainer = $('dupAlertContainer');
  const isBreakfast = (meal === 'breakfast');

  if (!state.items.length){
    p.innerHTML = '<div class="card empty">📭 لسه مفيش موظفين متسجلين في أوردر ' + esc(MEALS[meal].label) + '.</div>';
    dupContainer.innerHTML = '';
    return;
  }

  const dups = checkDuplicates(state.items);
  if (dups.length > 0){
    dupContainer.innerHTML = '<div class="alert-dup">' +
      '⚠️ <b>تنبيه بخصوص أوردرات مكررة:</b> تم تسجيل نفس الموظف والطلب مرتين:<br>' +
      dups.map(d => '• <b>' + esc(d.name) + ':</b> ' + esc(d.details)).join('<br>') +
      '</div>';
  } else {
    dupContainer.innerHTML = '';
  }

  const a = aggregate(state.items);
  let h = '';

  if (isBreakfast){
    h += '<div class="card"><h2>🍽️ طلبات مطعم الفول والطعام الشعبي</h2><ul class="agg">';
    if (a.bfSand.length) h += a.bfSand.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + ' سندوتش</b></li>').join('');
    if (a.bfBoxes.length) h += a.bfBoxes.map(b => '<li><span>' + esc(b.name) + '</span><b>' + b.qty + ' علبة</b></li>').join('');
    if (a.bfBread.length) h += a.bfBread.map(b => '<li><span>' + esc(b.name) + '</span><b>' + b.qty + ' رغيف</b></li>').join('');
    if (a.bfEggs.length) h += a.bfEggs.map(e => '<li><span>' + esc(e.name) + '</span><b>' + e.qty + ' عدد</b></li>').join('');
    if (a.bfMoney.length) h += a.bfMoney.map(m => '<li><span>' + esc(m.name) + '</span><b>بـ ' + fmt(m.amt) + ' جنيه</b></li>').join('');
    if (!a.bfSand.length && !a.bfBoxes.length && !a.bfMoney.length && !a.bfBread.length && !a.bfEggs.length) h += '<li class="muted">لا توجد طلبات مطعم</li>';
    h += '</ul></div>';
  } else {
    if (a.dinKoshary.length){
      h += '<div class="card"><h2>🥣 مشوار محل الكشري والطواجن</h2><ul class="agg">' +
        a.dinKoshary.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + ' عدد</b></li>').join('') + '</ul></div>';
    }
    if (a.dinSyrian.length){

        a.dinSyrian.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + ' عدد</b></li>').join('') + '</ul></div>';
    }
    if (a.dinGrill.length){
      h += '<div class="card" style="border-color:var(--warning-color)"><h2>🥩 مشوار المشويات والحواوشي والفراخ</h2><ul class="agg">' +
        a.dinGrill.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + ' عدد</b></li>').join('') + '</ul></div>';
    }
  }

  // كارت السوبر ماركت
  if (a.supermarket.length || a.supermarketMoney.length){
    h += '<div class="card" style="border-color:var(--secondary-neon)"><h2>🏪 مشوار السوبر ماركت والبقالة</h2><ul class="agg">';
    if (a.supermarket.length) h += a.supermarket.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.qty + ' عدد</b></li>').join('');

    h += '</ul></div>';

      a.bakery.map(b => '<li><span>' + esc(b.name) + '</span><b>' + b.qty + ' عدد</b></li>').join('') + '</ul></div>';

  // كارت الأصناف المتفرقة

       '<button class="btn ok" id="waSum" type="button">💬 إرسال عبر واتساب</button></div>';
  p.innerHTML = h;
  $('copySum').onclick = async () => toast(await copyText(buildSummary()) ? '📋 تم نسخ الملخص المفروز' : '❌ تعذر النسخ', 'info');

}

function renderDeliver(){
  const p = $('paneDeliver');
  const all = state.items, left = all.filter(i => !i.delivered);
  if (!all.length){
    p.innerHTML = '<div class="card empty">📭 مفيش طلبات للتوزيع لسه.</div>';
    return;
  }
  if (!left.length){
    p.innerHTML = '<div class="card party">🎉 عاش! كل الناس استلمت وحاسبت والأوردر اتقفل بنجاح</div>';
    return;
  }
  let h = '<div class="counter">متبقي ' + left.length + ' عمال لم يستلموا</div>';
  left.forEach(it => {
    const pc = payChoice[it.id] || 'cash';
    h += '<div class="card wcard" data-id="' + esc(it.id) + '">' +
      '<div class="name">' +
        '<span>👤 ' + esc(it.name) + '</span>' +
        '<div class="card-actions">' +
          '<button class="btn-icon" title="تعديل هذا الطلب" onclick="loadWorkerForEdit(\'' + esc(it.id) + '\')">✏️</button>' +
          '<button class="btn-icon del" title="حذف هذا الطلب" onclick="deleteWorker(\'' + esc(it.id) + '\')">🗑️</button>' +
        '</div>' +
      '</div>' +
      '<div class="items">📦 ' + esc(it.details) + '</div>' +
      '<div class="pays"><button type="button" class="pill ' + (pc === 'cash' ? 'on' : '') + '" data-pay="cash">💵 كاش</button>' +
      '<button type="button" class="pill ' + (pc === 'instapay' ? 'on' : '') + '" data-pay="instapay">📱 إنستاباي</button></div>' +
      '<button type="button" class="btn ok" style="width:100%" data-deliver>استلم وحاسب ✔</button></div>';
  });
  p.innerHTML = h;

  p.querySelectorAll('.wcard').forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
      payChoice[id] = b.dataset.pay;
      card.querySelectorAll('[data-pay]').forEach(x => x.classList.toggle('on', x === b));
    });
    card.querySelector('[data-deliver]').onclick = ev => {
      ev.currentTarget.disabled = true;
      const pay = payChoice[id] || 'cash';
      card.classList.add('fade');
      setTimeout(async () => {
        await mutate(cur => {
          const it = cur.items.find(x => x.id === id);
          if (it){ it.delivered = true; it.payment = pay; it.deliveredAt = Date.now(); }
          return cur;
        });
      }, 150);
    };
  });
}

/* ---------- تبويب كل الأوردرات ---------- */
function renderAllOrders(){
  const p = $('paneAll');
  if (!state.items.length){
    p.innerHTML = '<div class="card empty">📭 لا يوجد أي أوردرات مسجلة حتى الآن.</div>';
    return;
  }
  let h = '';
  state.items.forEach(it => {
    const statusBadge = it.delivered 
      ? '<span class="badge done">✔ استلم (' + (it.payment === 'instapay' ? '📱 إنستاباي' : '💵 كاش') + ')</span>'
      : '<span class="badge wait">⏳ لم يستلم بعد</span>';

    h += '<div class="card" style="margin-bottom:10px; padding:14px;">' +
      '<div class="name">' +
        '<span>👤 ' + esc(it.name) + ' ' + statusBadge + '</span>' +
        '<div class="card-actions">' +
          '<button class="btn-icon" title="تعديل هذا الطلب" onclick="loadWorkerForEdit(\'' + esc(it.id) + '\')">✏️</button>' +
          '<button class="btn-icon del" title="حذف هذا الطلب" onclick="deleteWorker(\'' + esc(it.id) + '\')">🗑️</button>' +
        '</div>' +
      '</div>' +
      '<div class="items" style="margin-top:8px;">📦 ' + esc(it.details) + '</div>' +
    '</div>';
  });
  p.innerHTML = h;
}

function loadWorkerForEdit(id){
  const it = state.items.find(x => x.id === id);
  if (!it) return;

  editingId = id;
  $('fName').value = it.name;
  $('fDetails').value = it.details || '';

  $('formTitle').textContent = '✏️ تعديل طلب (' + it.name + ')';
  $('savePersonBtn').textContent = '💾 حفظ التعديل';
  $('savePersonBtn').className = 'btn warn';

  $('formCard').scrollIntoView({ behavior: 'smooth' });
  $('fDetails').focus();
  toast('✏️ جاري تعديل طلب: ' + it.name, 'info');
}

async function deleteWorker(id){
  if (!confirm('هل تريد حذف هذا الطلب من القائمة؟')) return;
  if (editingId === id) resetFormToNew();
  await mutate(cur => {
    cur.items = cur.items.filter(x => x.id !== id);
    return cur;
  });
  toast('🗑️ تم حذف الطلب بنجاح', 'info');
}

function resetFormToNew(){
  editingId = null;
  $('fName').value = '';
  $('fDetails').value = '';
  $('formTitle').textContent = '➕ تسجيل طلب موظف';
  $('savePersonBtn').textContent = '💾 حفظ الطلب';
  $('savePersonBtn').className = 'btn ok';
  $('fName').focus();
}

/* ---------- حفظ الطلب والتفريغ الفوري للشخص التالي ---------- */
$('savePersonBtn').addEventListener('click', async () => {
  const name = $('fName').value.trim();
  const details = $('fDetails').value.trim();

  if (!name) return toast('⚠️ اكتب اسم الموظف الأول', 'error');
  if (!details) return toast('⚠️ اكتب تفاصيل الطلب', 'error');

  const btn = $('savePersonBtn'); 
  btn.disabled = true;

  try{
    if (editingId){
      await mutate(cur => {
        cur.items = cur.items.map(x => {
          if (x.id === editingId){
            return { ...x, name, details };
          }
          return x;
        });
        return cur;
      });
      toast('✅ تم تحديث طلب (' + name + ') بنجاح!');
      resetFormToNew();
    } else {
      const newId = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const newItem = {
        id: newId,
        name,
        details,
        delivered: false,
        payment: '',
        createdAt: Date.now()
      };

      await mutate(cur => {
        cur.items = cur.items.concat([newItem]);
        return cur;
      });

      resetFormToNew();
      toast('💾 تم حفظ (' + name + ')! اكتب الشخص اللي بعده.');
    }
  }catch(e){
    console.error(e);
    toast('❌ حصلت مشكلة في الحفظ', 'error');
  }finally{
    btn.disabled = false;
  }
});

/* ---------- تبديل التبويبات والوجبة ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { 
  tab = b.dataset.tab; 
  render(); 
}));

document.querySelectorAll('.meals button').forEach(b => b.addEventListener('click', () => {
  if (meal === b.dataset.meal) return;
  meal = b.dataset.meal; 
  resetFormToNew();
  isSummaryCalculated = false;
  $('dupAlertContainer').innerHTML = '';
  $('summaryResultsContainer').innerHTML = '<div class="card empty">اضغط على الزرار بالأعلى لفرز طلبات المطاعم والمحلات تلقائياً.</div>';
  updateMealUI();
  listen();
}));

/* ---------- بدء أوردر جديد ---------- */
$('resetBtnTop').addEventListener('click', async () => {
  if (!confirm('متأكد إنك عايز تبدأ أوردر جديد؟\nهيتم أرشفة الأوردر الحالي وتفريغ القائمة.')) return;
  try{
    const m = meal, cur = state;
    if (cur.items.length){
      try {
        await db.collection('work_orders_archive').add({
          meal: m, 
          items: cur.items, 
          archivedAt: firebase.firestore.FieldValue.serverTimestamp(), 
          archivedMs: Date.now()
        });
      } catch(e){}
    }
    resetFormToNew();
    isSummaryCalculated = false;
    $('dupAlertContainer').innerHTML = '';
    $('summaryResultsContainer').innerHTML = '<div class="card empty">اضغط على الزرار بالأعلى لفرز طلبات المطاعم والمحلات تلقائياً.</div>';
    await mutate(c => ({items:[]}));
    toast('🗑️ تم تفريغ الأوردر وبدء جلسة جديدة');
  }catch(e){ toast('❌ مشكلة في التعيين', 'error'); }
});

/* ---------- سجل 24 ساعة وحذف السجل نهائياً ---------- */
function sheetHtml(items){
  return items.map(it => {
    const st = it.delivered
      ? '<span class="ok-t">✔ استلم (' + (it.payment === 'instapay' ? '📱 إنستاباي' : '💵 كاش') + ')</span>'
      : '<span class="wait-t">⏳ لم يستلم</span>';
    return '<div class="sheet-row"><b>' + esc(it.name) + '</b> — ' + st + '<br><span class="muted">' + esc(it.details) + '</span></div>';
  }).join('');
}

$('sheetBtn').addEventListener('click', async () => {
  const body = $('sheetBody');
  body.innerHTML = '<div class="empty">⏳ جاري تحميل السجل...</div>';
  openM('mSheet');
  
  let h = '<h3 style="color:var(--primary-neon); margin-bottom:8px;">الأوردر الحالي</h3>' +
    (state.items.length ? sheetHtml(state.items) : '<div class="empty">لا توجد طلبات حالية</div>');
  
  try{
    const snap = await db.collection('work_orders_archive').where('meal','==',meal).get();
    const cutoff = Date.now() - 24*60*60*1000;
    const rows = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(d => (d.archivedMs || 0) >= cutoff).sort((a,b) => b.archivedMs - a.archivedMs);
    h += '<h3 style="margin-top:16px;color:var(--secondary-neon); margin-bottom:8px;">أوردرات سابقة في آخر 24 ساعة</h3>';
    h += rows.length ? rows.map(r => '<div class="muted" style="margin-top:8px">' +
      new Date(r.archivedMs).toLocaleString('ar-EG') + '</div>' + sheetHtml(r.items || [])).join('')
      : '<div class="empty">لا توجد أوردرات سابقة</div>';
  }catch(e){
    h += '<div class="empty muted">عرض السجل المحلي فقط</div>';
  }
  body.innerHTML = h;
});

$('deleteArchiveBtn').addEventListener('click', async () => {
  if (!confirm('⚠️ تحذير: هل أنت متأكد من مسح جميع الأوردرات السابقة والسجل نهائياً من قاعدة البيانات؟')) return;
  
  try{
    $('deleteArchiveBtn').disabled = true;
    const snap = await db.collection('work_orders_archive').where('meal', '==', meal).get();
    const batch = db.batch();
    snap.docs.forEach(doc => {
      batch.delete(doc.ref);
    });
    await batch.commit();

    $('sheetBody').innerHTML = '<div class="empty" style="color:var(--success-color)">🗑️ تم حذف السجل بالكامل بنجاح.</div>';
    toast('✅ تم حذف السجل نهائياً من قاعدة البيانات بنجاح!');
  }catch(e){
    console.error(e);
    toast('❌ تعذر حذف السجل من قاعدة البيانات', 'error');
  }finally{
    $('deleteArchiveBtn').disabled = false;
  }
});

/* ---------- تشغيل البرنامج وضبط الواجهة ---------- */
updateMealUI();
listen();
</script>
